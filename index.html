<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="APP Metas Amables">

<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FFFFFF;
    --surface: #FFFFFF;
    --ink: #101010;
    --ink-soft: #63625A;
    --border: #E2E1D8;
    --moss: #E8002C;
    --moss-deep: #A8001F;
    --moss-tint: #FCE7EB;
    --honey: #C9942D;
    --honey-tint: #FAF0DC;
    --leaf: #E8002C;
    --radius: 14px;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Karla', sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .app{
    max-width: 480px;
    margin: 0 auto;
    padding: 28px 20px 60px;
    min-height: 100vh;
  }
  @media (min-width: 900px){
    .app{ max-width: 720px; padding: 40px 32px 80px; }
    .cal-grid{ gap: 8px; }
  }
  @media (min-width: 1300px){
    .app{ max-width: 860px; }
  }
  .wordmark{
    font-family: 'Lora', serif;
    font-weight: 600;
    font-size: 22px;
    color: var(--moss-deep);
    letter-spacing: -0.01em;
  }
  .wordmark span{ color: var(--ink-soft); font-weight: 400; font-size: 15px; display:block; margin-top: 2px; font-family:'Karla',sans-serif; }
  .brand-row{ display:flex; align-items:center; gap:10px; }
  .brand-icon{ width:34px; height:34px; border-radius:50%; object-fit:cover; flex-shrink:0; }
  .brand-hero{ width:100%; max-width:340px; height:auto; display:block; margin: 4px auto 22px; }
  
  header.top{
    display:flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 28px;
  }
  .who{
    text-align:right;
    font-size: 14px;
    color: var(--ink-soft);
  }
  .who .greeting{
    font-family: 'Lora', serif;
    font-size: 20px;
    font-weight: 600;
    color: var(--ink);
    display:block;
    line-height: 1.2;
  }
  .who button{
    background:none; border:none; color: var(--moss); font-family:'Karla'; font-size:13px;
    text-decoration: underline; cursor:pointer; padding: 2px 0; margin-top:2px;
  }
  h1{ font-family:'Lora',serif; font-size: 26px; font-weight:600; margin: 0 0 6px; color: var(--ink); line-height:1.25;}
  p.lead{ color: var(--ink-soft); font-size: 15px; line-height:1.5; margin: 0 0 24px; }

  /* Name picker */
  .grid-names{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 22px;
  }
  .name-card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 14px;
    font-family: 'Karla';
    font-size: 15px;
    font-weight: 500;
    color: var(--ink);
    cursor: pointer;
    text-align: left;
    transition: border-color .15s ease, background .15s ease;
  }
  .name-card:hover{ border-color: var(--moss); background: var(--moss-tint); }
  .name-card:active{ transform: translateY(1px); }

  .link-quiet{
    display:inline-block;
    color: var(--ink-soft);
    font-size: 14px;
    text-decoration: underline;
    cursor: pointer;
    background:none; border:none; font-family:'Karla'; padding: 6px 0;
  }
  .link-quiet:hover{ color: var(--moss-deep); }

  /* Card / section */
  .card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
    margin-bottom: 18px;
    box-shadow: 0 1px 3px rgba(20,20,10,.04), 0 4px 14px rgba(20,20,10,.03);
  }
  .week-label{
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  .question{
    font-family:'Lora', serif;
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 18px;
    line-height:1.35;
  }
  .btn{
    width:100%;
    display:block;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    font-family:'Karla';
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 10px;
    text-align: left;
    transition: all .15s ease;
    color: var(--ink);
    box-shadow: 0 1px 2px rgba(20,20,10,.03);
  }
  .btn .sub{ display:block; font-weight:400; font-size:13px; color:var(--ink-soft); margin-top:2px;}
  .btn-yes{ border-color: var(--moss); }
  .btn-yes:hover{ background: var(--moss); color: #fff; }
  .btn-yes:hover .sub{ color: #DCE9DD; }
  .btn-no{ border-color: var(--honey); }
  .btn-no:hover{ background: var(--honey); color:#fff; }
  .btn-no:hover .sub{ color: #FCEBCE; }

  .btn-yes.selected{ background: var(--moss); border-color: var(--moss); color:#fff; }
  .btn-yes.selected .sub{ color:#DCE9DD; }
  .btn-no.selected{ background: var(--honey); border-color: var(--honey); color:#fff; }
  .btn-no.selected .sub{ color:#FCEBCE; }

  textarea{
    width:100%;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    font-family:'Karla';
    font-size: 14px;
    color: var(--ink);
    resize: vertical;
    min-height: 60px;
    margin-top: 4px;
    background: #FCFCF9;

<body>
<div class="app" id="app"></div>

<script>
(function(){
  const app = document.getElementById('app');
  let state = {
    view: 'loading',
    me: null,
    members: [],
    checkins: {},
    passwords: {},
    panelUrls: {},
    groups: {},
    guiaUrl: '',
    sesionesTexto: '',
    loginError: '',
    loginView: 'login',
    selection: null,
    noteDraft: '',
    metaTrimDraft: '',
    metaSemDraft: '',
    identidadDraft: '',
    saving: false,
    savedMsg: '',
    metaSavedMsg: ''
  };

  function isoWeek(d){
    const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    const dayNum = (date.getUTCDay() + 6) % 7;
    date.setUTCDate(date.getUTCDate() - dayNum + 3);
    const firstThursday = new Date(Date.UTC(date.getUTCFullYear(),0,4));
    const weekNum = 1 + Math.round(((date - firstThursday) / 86400000 - 3 + ((firstThursday.getUTCDay()+6)%7)) / 7);
    return date.getUTCFullYear() + '-W' + String(weekNum).padStart(2,'0');
  }

  function weekLabel(d){
    const day = (d.getDay()+6)%7;
    const monday = new Date(d); monday.setDate(d.getDate() - day);
    const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
    const opts = {day:'numeric', month:'long'};
    return 'Semana del ' + monday.toLocaleDateString('es-ES',{day:'numeric'}) + ' al ' + sunday.toLocaleDateString('es-ES', opts);
  }

  function weekShort(d){
    const day = (d.getDay()+6)%7;
    const monday = new Date(d); monday.setDate(d.getDate() - day);
    const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
    const m = monday.toLocaleDateString('es-ES',{month:'short'}).replace('.','');
    return monday.getDate() + '-' + sunday.getDate() + ' ' + m + ' ' + monday.getFullYear();
  }

  const today = new Date();
  const currentWeek = isoWeek(today);
  const currentWeekLabel = weekLabel(today);
  const currentWeekShort = weekShort(today);

  // Trimestre actual
  const currentQ = Math.floor(today.getMonth() / 3) + 1;
  const qNames = {1:'1er',2:'2º',3:'3er',4:'4º'};
  const qMonths = {
    1:['enero','febrero','marzo'],
    2:['abril','mayo','junio'],
    3:['julio','agosto','septiembre'],
    4:['octubre','noviembre','diciembre']
  };
  const currentQLabel = qNames[currentQ] + ' trimestre';
  const currentQMonths = qMonths[currentQ];

  // Calcular todas las semanas (lunes) del trimestre actual
  function getQuarterWeeks(){
    const qStart = new Date(today.getFullYear(), (currentQ-1)*3, 1);
    const qEnd = new Date(today.getFullYear(), currentQ*3, 0); // último día del trimestre
    const weeks = [];
    // Buscar el primer lunes del trimestre (o el lunes anterior si el 1 no es lunes)
    const d = new Date(qStart);
    const dayOfWeek = (d.getDay()+6)%7; // 0=lunes
    d.setDate(d.getDate() - dayOfWeek); // retroceder al lunes
    while(d <= qEnd){
      weeks.push({
        iso: isoWeek(d),
        short: weekShort(d),
        month: d.toLocaleDateString('es-ES',{month:'short'}).replace('.','')
      });
      d.setDate(d.getDate() + 7);
    }
    return weeks;
  }
  const quarterWeeks = getQuarterWeeks();

  // Calcular las semanas (lunes) que caen dentro de un mes concreto, en filas completas por semana
  function getMonthWeeks(year, monthIndex){
    const mStart = new Date(year, monthIndex, 1);
    const mEnd = new Date(year, monthIndex+1, 0);
    const weeks = [];
    const seen = new Set();
    const d = new Date(mStart);
    const dayOfWeek = (d.getDay()+6)%7;
    d.setDate(d.getDate() - dayOfWeek);
    while(d <= mEnd){
      // Solo contamos la semana como "de este mes" si su lunes cae en este mes,
      // o si es la primera semana del mes (lunes en mes anterior pero contiene días de este mes)
      const key = isoWeek(d);
      if(!seen.has(key)){
        seen.add(key);
        weeks.push({ iso: key, short: weekShort(d) });
      }
      d.setDate(d.getDate() + 7);
    }
    return weeks;
  }

  const monthNamesEs = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

  // Género de cada practicante, para "Bienvenido/a". Añade aquí los nombres nuevos que hagan falta.
  const GENERO = { 'Gustavo':'m', 'Rafael':'m', 'Empar':'f', 'Rosa':'f', 'Shayo':'f', 'Ana María':'f' };
  function bienvenidaTexto(name){
    const g = GENERO[name];
    if(g === 'f') return 'Bienvenida';
    if(g === 'm') return 'Bienvenido';
    return 'Bienvenido/a';
  }

  // Interpreta líneas de texto tipo "7 de septiembre" y devuelve {day, monthIdx, year}
  function parseSesionesFechas(text){
    if(!text) return [];
    const quitarAcentos = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
    const out = [];
    lines.forEach(line => {
      const lower = quitarAcentos(line.toLowerCase());
      const dayMatch = lower.match(/(\d{1,2})/);
      if(!dayMatch) return;
      const day = parseInt(dayMatch[1], 10);
      let monthIdx = null;
      for(let i = 0; i < monthNamesEs.length; i++){
        if(lower.includes(quitarAcentos(monthNamesEs[i]))){ monthIdx = i; break; }
      }
      if(monthIdx === null) monthIdx = today.getMonth();
      let year = today.getFullYear();
      // Si el mes ya quedó muy atrás en el año (más de 6 meses), asumimos que es del año siguiente
      if(monthIdx < today.getMonth() - 6) year += 1;
      out.push({ day, monthIdx, year, raw: line });
    });
    return out;
  }

  function buildMonthGrid(year, monthIndex){
    const firstDay = new Date(year, monthIndex, 1);
    const daysInMonth = new Date(year, monthIndex+1, 0).getDate();
    const startOffset = (firstDay.getDay()+6)%7; // 0=lunes
    const cells = [];
    for(let i=0;i<startOffset;i++) cells.push(null);
    for(let d=1; d<=daysInMonth; d++) cells.push(d);
    while(cells.length % 7 !== 0) cells.push(null);
    const weeks = [];
    for(let i=0;i<cells.length;i+=7) weeks.push(cells.slice(i,i+7));
    return weeks;
  }

  function renderSesionesCalendario(text){
    const sesiones = parseSesionesFechas(text);
    // Agrupar sesiones encontradas por mes/año
    const groups = {};
    sesiones.forEach(s => {
      const key = s.year + '-' + s.monthIdx;
      if(!groups[key]) groups[key] = { year: s.year, monthIdx: s.monthIdx, days: [] };
      groups[key].days.push(s.day);
    });
    // Rango fijo siempre visible: mes anterior + actual + 3 siguientes (5 meses)
    for(let offset = -1; offset <= 3; offset++){
      const totalMonth = today.getMonth() + offset;
      const y = today.getFullYear() + Math.floor(totalMonth / 12);
      const m = ((totalMonth % 12) + 12) % 12;
      const key = y + '-' + m;
      if(!groups[key]) groups[key] = { year: y, monthIdx: m, days: [] };
    }
    const sortedKeys = Object.keys(groups).sort((a,b) => {
      const ga = groups[a], gb = groups[b];
      return (ga.year - gb.year) || (ga.monthIdx - gb.monthIdx);
    });
    const todayY = today.getFullYear(), todayM = today.getMonth(), todayD = today.getDate();
    let html = '';
    if(sesiones.length === 0){
      html += '<div style="font-size:13px;color:var(--ink-soft);margin-bottom:10px">Aún no hay fechas publicadas.</div>';
    }
    sortedKeys.forEach(key => {
      const g = groups[key];
      const weeks = buildMonthGrid(g.year, g.monthIdx);
      html += `<div style="margin-bottom:20px">`;
      html += `<div style="font-weight:700;font-size:16px;text-transform:capitalize;margin-bottom:8px">${monthNamesEs[g.monthIdx]} ${g.year}</div>`;
      html += `<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:14px;font-weight:700;color:var(--ink);text-align:center;margin-bottom:6px">
        <div>L</div><div>M</div><div>X</div><div>J</div><div>V</div><div>S</div><div>D</div></div>`;
      weeks.forEach(week => {
        html += `<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px">`;
        week.forEach(day => {
          if(day === null){ html += `<div></div>`; return; }
          const isToday = (g.year===todayY && g.monthIdx===todayM && day===todayD);
          const isSesion = g.days.includes(day);
          let cellDate = new Date(g.year, g.monthIdx, day);
          let cellToday = new Date(todayY, todayM, todayD);
          const isPast = cellDate < cellToday;
          let circleColor = '';
          if(isSesion) circleColor = isPast ? '#B94A3A' : '#4C8C5C';
          const bgStyle = isSesion ? `background:${circleColor};color:#fff;` : '';
          if(isToday){
            html += `<div style="aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:4px;border-radius:8px;font-weight:700;border:2.5px solid var(--ink);${bgStyle}">
              <span style="font-size:11px;letter-spacing:.03em;line-height:1">HOY</span><span style="font-size:38px;line-height:1.1">${day}</span>
            </div>`;
          } else {
            html += `<div style="aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:38px;font-weight:${isSesion?'700':'400'};${bgStyle}">
              <span>${day}</span>
            </div>`;
          }
        });
        html += `</div>`;
      });
      html += `</div>`;
    });
    html += `<div style="display:flex;gap:14px;font-size:11px;color:var(--ink-soft);margin-top:6px;flex-wrap:wrap">
      <span>⬤ <span style="color:#4C8C5C">Sesión futura</span></span>
      <span>⬤ <span style="color:#B94A3A">Sesión pasada</span></span>
      <span>▢ <span>Hoy</span></span>
    </div>`;
    return html;
  }

  // Construir los 12 meses del año, empezando por el mes del trimestre actual
  function getYearMonths(){
    const startMonthIdx = (currentQ - 1) * 3; // primer mes del trimestre actual
    const months = [];
    for(let i=0; i<12; i++){
      const offset = startMonthIdx + i;
      const y = today.getFullYear() + Math.floor(offset / 12);
      const m = ((offset % 12) + 12) % 12;
      months.push({
        year: y,
        monthIndex: m,
        label: monthNamesEs[m],
        weeks: getMonthWeeks(y, m)
      });
    }
    return months;
  }

  const DEFAULT_MEMBERS = ['Empar','Rafael','Rosa','Shayo','Ana María'];

  const APP_VERSION = 'V41';

  // ==== Conexión con Airtable ====
  // El token NO está en el código — se inyecta via URL (?t=TOKEN) o localStorage
  const AIR = {
    base: 'appB3nXTGf3wWu0sI',
    table: 'tblYUORCDMOtD3FFo',
    token: null, // se carga en init()
    fields: { alumno: 'Practicante', semana: 'Semana', cumplida: 'Cumplida', notas: 'Notas', metaTrim: 'Meta trimestre', metaSem: 'Meta semana', identidad: 'Identidad', pass: 'Contraseña', urlPanel: 'URL PANEL', grupo: 'Grupo MAC', urlGuia: 'URL Guías Mensuales', fechasSesiones: 'Fechas Sesiones' }
  };
  const SESIONES_SOURCE = 'Gustavo'; // fila desde la que se lee el calendario de sesiones, compartido para todos
  const AIR_URL = 'https://api.airtable.com/v0/' + AIR.base + '/' + encodeURIComponent(AIR.table);
  function airHeaders(){
    return { 'Authorization': 'Bearer ' + AIR.token, 'Content-Type': 'application/json' };
  }

  // Trae TODAS las filas de la tabla y las agrupa por practicante
  async function fetchAllRecords(){
    let all = [];
    let offset = null;
    do {
      let url = AIR_URL + '?pageSize=100';
      if(offset) url += '&offset=' + encodeURIComponent(offset);
      const res = await fetch(url, { headers: airHeaders() });
      if(!res.ok){ throw new Error('Airtable ' + res.status); }
      const data = await res.json();
      all = all.concat(data.records || []);
      offset = data.offset;
    } while(offset);
    return all;
  }

  function cleanUrl(raw){
    if(!raw) return '';
    let s = String(raw).trim();
    // Si el texto contiene "http" más de una vez, nos quedamos solo con la primera URL
    const firstIdx = s.indexOf('http');
    if(firstIdx === -1) return s;
    const secondIdx = s.indexOf('http', firstIdx + 4);
    if(secondIdx !== -1){
      s = s.slice(firstIdx, secondIdx);
    } else {
      s = s.slice(firstIdx);
    }
    return s.trim();
  }

  function recordsToCheckins(records){
    const byName = {};
    const passwords = {};
    const panelUrls = {};
    const groups = {};
    records.forEach(r => {
      const f = r.fields || {};
      const name = f[AIR.fields.alumno];
      if(!name) return;
      if(!byName[name]) byName[name] = [];
      if(f[AIR.fields.pass]) passwords[name] = f[AIR.fields.pass];
      if(f[AIR.fields.urlPanel]) panelUrls[name] = cleanUrl(f[AIR.fields.urlPanel]);
      const g = f[AIR.fields.grupo];
      if(g && Array.isArray(g) && g.length > 0 && !groups[name]) groups[name] = g;
      byName[name].push({
        id: r.id,
        week: f[AIR.fields.semana] || '',
        label: f[AIR.fields.semana] || '',
        cumplida: !!f[AIR.fields.cumplida],
        nota: f[AIR.fields.notas] || '',
        metaTrim: f[AIR.fields.metaTrim] || '',
        metaSem: f[AIR.fields.metaSem] || '',
        identidad: f[AIR.fields.identidad] || '',
        urlPanel: f[AIR.fields.urlPanel] || '',
        urlGuia: f[AIR.fields.urlGuia] || '',
        fechasSesiones: f[AIR.fields.fechasSesiones] || '',
        grupo: g || []
      });
    });
    return { byName, passwords, panelUrls, groups };
  }

  function isModerador(name){
    const g = state.groups[name] || [];
    return g.includes('Moderador');
  }

  function shareGroup(nameA, nameB){
    const gA = (state.groups[nameA] || []).filter(x => x !== 'Moderador');
    const gB = (state.groups[nameB] || []).filter(x => x !== 'Moderador');
    return gA.some(x => gB.includes(x));
  }

  async function refreshAll(){
    const records = await fetchAllRecords();
    const result = recordsToCheckins(records);
    state.checkins = result.byName;
    state.passwords = result.passwords;
    state.panelUrls = result.panelUrls;
    state.groups = result.groups;
    state.members = Object.keys(result.passwords);
    state.members.forEach(m => { if(!state.checkins[m]) state.checkins[m] = []; });
    // Fechas de sesiones: compartidas para todos, se leen de la fila de SESIONES_SOURCE
    const sourceList = state.checkins[SESIONES_SOURCE] || [];
    const withFechas = sourceList.filter(c => c.fechasSesiones && c.fechasSesiones.trim());
    state.sesionesTexto = withFechas.length > 0 ? withFechas[withFechas.length - 1].fechasSesiones : '';

  async function init(){
    // Cargar token: primero desde URL (?t=...), luego desde localStorage
    const urlParams = new URLSearchParams(window.location.search);
    const urlToken = urlParams.get('t');
    if(urlToken){
      AIR.token = urlToken;
      try{ localStorage.setItem('air_token', urlToken); }catch(e){}
      // Limpiar token de la URL sin recargar
      const cleanUrl = window.location.pathname;
      window.history.replaceState({}, '', cleanUrl);
    } else {
      try{ AIR.token = localStorage.getItem('air_token'); }catch(e){}
    }

    if(!AIR.token){
      state.view = 'notoken'; window.scrollTo(0,0); render();
      return;
    }

    state.view = 'pick'; window.scrollTo(0,0); render();
    try {
      await refreshAll();
    } catch(e){
      state.loadError = e.message;
    }
    // Si ya se había iniciado sesión antes en este dispositivo, entrar directo
    let savedUser = null;
    try{ savedUser = localStorage.getItem('ma_user'); }catch(e){}
    if(savedUser && state.passwords[savedUser]){
      pickMe(savedUser);
      return;
    }
    render();
  }

  function loginWithPassword(pass){
    pass = (pass || '').trim();
    if(!pass){ state.loginError = 'Escribe tu contraseña'; render(); return; }
    const found = Object.entries(state.passwords).find(([name, p]) => p === pass);
    if(!found){ state.loginError = 'Contraseña incorrecta'; render(); return; }
    state.loginError = '';
    try{ localStorage.setItem('ma_user', found[0]); }catch(e){}
    pickMe(found[0]);
  }

  async function changePassword(currentPass, newPass){
    currentPass = (currentPass||'').trim();
    newPass = (newPass||'').trim();
    if(!currentPass || !newPass){ state.loginError = 'Rellena ambos campos'; render(); return; }
    if(newPass.length < 3){ state.loginError = 'La nueva contraseña debe tener al menos 3 caracteres'; render(); return; }
    const found = Object.entries(state.passwords).find(([name, p]) => p === currentPass);
    if(!found){ state.loginError = 'Contraseña actual incorrecta'; render(); return; }
    const userName = found[0];
    const records = state.checkins[userName] || [];
    try {
      for(const rec of records){
        if(rec.id){
          const fields = {}; fields[AIR.fields.pass] = newPass;
          await fetch(AIR_URL + '/' + rec.id, { method:'PATCH', headers:airHeaders(), body:JSON.stringify({fields}) });
        }
      }
      state.passwords[userName] = newPass;
      state.loginError = '';
      state.loginView = 'login';
      state.savedMsg = 'Contraseña cambiada ✓';
      render();
    } catch(e){
      state.loginError = 'No se pudo cambiar (revisa tu conexión)';
      render();
    }
  }

  async function ensureCheckins(name){
    if(!state.checkins[name]) state.checkins[name] = [];
    return state.checkins[name];
  }

  async function pickMe(name){
    state.me = name;
    state.selection = null;
    state.noteDraft = '';
    state.metaTrimDraft = '';
    state.metaSemDraft = '';
    state.identidadDraft = '';
    state.savedMsg = '';
    state.metaSavedMsg = '';
    state.view = 'panel'; window.scrollTo(0,0); render();
    try { await refreshAll(); } catch(e){}
    const list = state.checkins[name] || [];
    // Identidad, meta trimestral y URL de guía: del registro más reciente (cualquier semana)
    if(list.length > 0){
      const latest = list[list.length - 1];
      state.identidadDraft = latest.identidad || '';
      state.metaTrimDraft = latest.metaTrim || '';
      state.guiaUrl = latest.urlGuia || '';
    }
    // Meta semanal: solo si ya hay registro de ESTA semana
    const thisWeek = list.find(c => c.week === currentWeekShort);
    if(thisWeek){
      state.metaSemDraft = thisWeek.metaSem || '';
      state.selection = thisWeek.cumplida ? 'yes' : (thisWeek.week === currentWeekShort ? null : 'no');
      state.noteDraft = thisWeek.nota || '';
    }
    render();
  }

  async function saveMetas(identidad, metaTrim, metaSem){
    state.identidadDraft = identidad || '';
    state.metaTrimDraft = metaTrim || '';
    state.metaSemDraft = metaSem || '';
    state.metaSavedMsg = 'Guardando…';
    render();

    try {
      const list = await ensureCheckins(state.me);
      const thisWeek = list.find(c => c.week === currentWeekShort);
      const fields = {};
      fields[AIR.fields.alumno] = state.me;
      fields[AIR.fields.semana] = currentWeekShort;
      fields[AIR.fields.identidad] = (identidad || '').trim();
      fields[AIR.fields.metaTrim] = (metaTrim || '').trim();
      fields[AIR.fields.metaSem] = (metaSem || '').trim();
      fields[AIR.fields.pass] = state.passwords[state.me] || '';
      if(state.groups[state.me] && state.groups[state.me].length) fields[AIR.fields.grupo] = state.groups[state.me];
      if(state.guiaUrl) fields[AIR.fields.urlGuia] = state.guiaUrl;

      if(thisWeek && thisWeek.id){
        const res = await fetch(AIR_URL + '/' + thisWeek.id, {
          method: 'PATCH', headers: airHeaders(), body: JSON.stringify({ fields })
        });
        if(!res.ok){
          const errBody = await res.text().catch(()=>'');
          throw new Error('Airtable ' + res.status + ': ' + errBody.slice(0,200));
        }
        thisWeek.identidad = fields[AIR.fields.identidad];
        thisWeek.metaTrim = fields[AIR.fields.metaTrim];
        thisWeek.metaSem = fields[AIR.fields.metaSem];
      } else {
        const res = await fetch(AIR_URL, {
          method: 'POST', headers: airHeaders(), body: JSON.stringify({ fields })
        });
        if(!res.ok){
          const errBody = await res.text().catch(()=>'');
          throw new Error('Airtable ' + res.status + ': ' + errBody.slice(0,200));
        }
        const data = await res.json();
        list.push({ id: data.id, week: currentWeekShort, label: currentWeekLabel, cumplida: false, nota:'', identidad: fields[AIR.fields.identidad], metaTrim: fields[AIR.fields.metaTrim], metaSem: fields[AIR.fields.metaSem] });
      }
      state.metaSavedMsg = 'Guardado ✓';
    } catch(e){
      console.error('Error guardando metas:', e);
      state.metaSavedMsg = '⚠️ ' + (e && e.message ? e.message : 'Error desconocido al guardar');
    }
    render();
  }

  async function saveCheckin(val, nota, metaTrim, metaSem, identidad){
    state.selection = val;
    state.noteDraft = nota;
    state.metaTrimDraft = metaTrim || '';
    state.metaSemDraft = metaSem || '';
    state.identidadDraft = identidad || '';
    state.saving = true;
    state.savedMsg = 'Guardando…';
    render();

    try {
      const list = await ensureCheckins(state.me);
      const thisWeek = list.find(c => c.week === currentWeekShort);
      const fields = {};
      fields[AIR.fields.alumno] = state.me;
      fields[AIR.fields.semana] = currentWeekShort;
      fields[AIR.fields.cumplida] = (val === 'yes');
      fields[AIR.fields.notas] = (nota || '').trim();
      fields[AIR.fields.metaTrim] = (metaTrim || '').trim();
      fields[AIR.fields.metaSem] = (metaSem || '').trim();
      fields[AIR.fields.identidad] = (identidad || '').trim();
      fields[AIR.fields.pass] = state.passwords[state.me] || '';
      if(state.groups[state.me] && state.groups[state.me].length) fields[AIR.fields.grupo] = state.groups[state.me];
      if(state.guiaUrl) fields[AIR.fields.urlGuia] = state.guiaUrl;

      if(thisWeek && thisWeek.id){
        const res = await fetch(AIR_URL + '/' + thisWeek.id, {
          method: 'PATCH', headers: airHeaders(), body: JSON.stringify({ fields })
        });
        if(!res.ok){
          const errBody = await res.text().catch(()=>'');
          throw new Error('Airtable ' + res.status + ': ' + errBody.slice(0,200));
        }
        thisWeek.cumplida = (val==='yes');
        thisWeek.nota = fields[AIR.fields.notas];
        thisWeek.identidad = fields[AIR.fields.identidad];
        thisWeek.metaTrim = fields[AIR.fields.metaTrim];
        thisWeek.metaSem = fields[AIR.fields.metaSem];
      } else {
        const res = await fetch(AIR_URL, {
          method: 'POST', headers: airHeaders(), body: JSON.stringify({ fields })
        });
        if(!res.ok){
          const errBody = await res.text().catch(()=>'');
          throw new Error('Airtable ' + res.status + ': ' + errBody.slice(0,200));
        }
        const data = await res.json();
        list.push({ id: data.id, week: currentWeekShort, label: currentWeekLabel, cumplida: (val==='yes'), nota: fields[AIR.fields.notas], identidad: fields[AIR.fields.identidad], metaTrim: fields[AIR.fields.metaTrim], metaSem: fields[AIR.fields.metaSem] });
      }
      state.saving = false;
      state.savedMsg = 'Guardado ✓';
      state.lastResult = val;
      state.view = (val === 'yes') ? 'celebrate' : 'reflect';
    } catch(e){
      console.error('Error guardando checkin:', e);
      state.saving = false;
      state.savedMsg = '⚠️ ' + (e && e.message ? e.message : 'Error desconocido al guardar');
    }
    render();
  }

  function speak(text){
    try{
      if(!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'es-ES';
      utter.rate = 0.95;
      window.speechSynthesis.speak(utter);
    }catch(e){ console.error('No se pudo hablar:', e); }
  }

  function launchConfetti(){
    const colors = ['#E8002C','#C9942D','#F9C22D','#3F5D45','#1A1A1A'];
    const container = document.createElement('div');
    container.style.cssText = 'position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9999;';
    document.body.appendChild(container);
    for(let i=0; i<80; i++){
      const p = document.createElement('div');
      const size = 8 + Math.random()*8;
      const color = colors[Math.floor(Math.random()*colors.length)];
      const left = Math.random()*100;
      const delay = Math.random()*0.6;
      const duration = 3.5 + Math.random()*2;
      const rotate = Math.random()*360;
      p.style.cssText = `position:absolute;top:-30px;left:${left}%;width:${size}px;height:${size*0.6}px;background:${color};opacity:1;transform:rotate(${rotate}deg);border-radius:2px;animation:confetti-fall ${duration}s ease-in ${delay}s forwards;`;
      container.appendChild(p);
    }
    setTimeout(() => container.remove(), 7000);
  }

  async function addMember(name){
    name = name.trim();
    if(!name) return;
    if(state.members.length >= 10) return;
    if(state.members.includes(name)) return;
    state.members.push(name);
    await saveMembers(state.members);
    render();
  }

  async function removeMember(name){
    state.members = state.members.filter(m => m !== name);
    await saveMembers(state.members);
    if(state.me === name){ state.me = null; state.view = 'pick'; }
    render();
  }

  function lastWeeksHistory(name, n){
    const list = state.checkins[name] || [];
    const map = {};
    list.forEach(c => map[c.week] = c);
    const out = [];
    for(let i=n-1; i>=0; i--){
      const d = new Date(today);
      d.setDate(d.getDate() - i*7);
      const w = isoWeek(d);
      out.push(map[w] || null);
    }
    return out;
  }

        <p style="margin:0 0 8px;font-size:17px"><b>💬 Dudas y sugerencias</b></p>
        <p style="font-size:13px;color:var(--ink-soft);margin:0 0 10px">¿Algo que preguntar o que quieras contarnos? Escribe a Gustavo.</p>
        <a class="panel-link-btn" href="https://wa.me/34658825799?text=${encodeURIComponent('Escribo de la App Metas Amables. Tengo esta duda o sugerencia:')}" target="_blank" style="background:#8A8A82">Contacta con Gustavo →</a>
      `;
      app.appendChild(help);
      return;
    }

    if(state.view === 'checkin'){
      // Saludo grande entre logo y tabs
      app.appendChild(el(`<div style="text-align:center;margin-bottom:14px"><div style="font-family:'Lora',serif;font-size:24px;font-weight:600;color:var(--ink)">Hola, ${state.me}</div><div style="font-family:'Karla',sans-serif;font-size:15px;font-weight:700;color:var(--ink);margin-top:2px">${bienvenidaTexto(state.me)} a tu Panel de Control</div></div>`));

      const nav = document.createElement('nav');
      nav.className = 'tabs';
      nav.innerHTML = `<button id="toPanel">📋 Panel</button><button class="active">Mi semana</button><button id="toGroup">Compañeros</button><button id="toCal">📅 Calendario</button>`;
      app.appendChild(nav);
      nav.querySelector('#toPanel').onclick = () => { state.view='panel'; window.scrollTo(0,0); render(); };
      nav.querySelector('#toGroup').onclick = openGroupPanel;
      nav.querySelector('#toCal').onclick = () => { state.view='calendar'; window.scrollTo(0,0); render(); };

      const list = state.checkins[state.me] || [];
      const thisWeek = list.find(c => c.week === currentWeekShort);
      const latest = list.length > 0 ? list[list.length - 1] : null;
      const sel = state.selection !== null ? state.selection : (thisWeek ? (thisWeek.cumplida ? 'yes' : 'no') : null);

      // Tarjeta 1: Meta trimestral, arriba de todo
      const curIdentidad = state.identidadDraft || (latest ? latest.identidad : '') || '';
      const curMetaTrim = state.metaTrimDraft || (latest ? latest.metaTrim : '') || '';
      const curMetaSem = state.metaSemDraft || (thisWeek ? thisWeek.metaSem : '') || '';
      const trimCard = document.createElement('div');
      trimCard.className = 'card';
      trimCard.innerHTML = `
        <label class="note-label strong" for="metaTrim">🎯 Meta ${currentQLabel} (${currentQMonths.join(', ')})</label>
        <textarea id="metaTrim" placeholder="¿Cuál es tu meta para este trimestre?" style="min-height:44px">${curMetaTrim}</textarea>
      `;
      app.appendChild(trimCard);
      const metaTrimEl = trimCard.querySelector('#metaTrim');
      metaTrimEl.oninput = (e) => { state.metaTrimDraft = e.target.value; state.metaSavedMsg=''; };

      // Tarjeta 2: Lunes de Compromiso — identidad + meta semanal + guardar y compartir
      const metaCard = document.createElement('div');
      metaCard.className = 'card';
      metaCard.innerHTML = `
        <div class="question" style="font-size:19px;margin-bottom:14px">🗓️ Lunes de Compromiso</div>
        <label class="note-label strong" for="identidad">🪞 Mi identidad de meta</label>
        <textarea id="identidad" placeholder="Ej: María, la que hace yoga cuatro veces por semana" style="min-height:44px;margin-bottom:16px">${curIdentidad}</textarea>
        <label class="note-label strong" for="metaSem">Meta semanal (${currentWeekLabel.replace('Semana d','d')})</label>
        <textarea id="metaSem" placeholder="¿Qué te propones esta semana?" style="min-height:44px;margin-bottom:14px">${curMetaSem}</textarea>
        <button class="btn btn-yes" id="btnSaveMetas" style="text-align:center">💾📲 Guardar y compartir en WhatsApp</button>
        <div class="saved-msg">${state.metaSavedMsg}</div>
      `;
      app.appendChild(metaCard);
      const identidadEl = metaCard.querySelector('#identidad');
      const metaSemEl = metaCard.querySelector('#metaSem');
      identidadEl.oninput = (e) => { state.identidadDraft = e.target.value; state.metaSavedMsg=''; };
      metaSemEl.oninput = (e) => { state.metaSemDraft = e.target.value; state.metaSavedMsg=''; };
      metaCard.querySelector('#btnSaveMetas').onclick = () => {
        const msg = 'Mi compromiso para este Lunes de Compromiso es:\n\n' + identidadEl.value.trim() + '\n\nEsta semana: ' + metaSemEl.value.trim();
        window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank');
        saveMetas(identidadEl.value, metaTrimEl.value, metaSemEl.value).catch(err => {
          console.error('Fallo no controlado en saveMetas:', err);
          state.metaSavedMsg = '⚠️ Error inesperado: ' + err.message;
          render();
        });
      };

      // Tarjeta de checkin semanal
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="week-label">${currentWeekLabel}</div>
        <div class="question">¿Cumpliste tu práctica esta semana?</div>
        <button class="btn btn-yes ${sel==='yes'?'selected':''}" id="btnYes">
          Sí, la cumplí
          <span class="sub">Aunque haya sido de forma imperfecta, cuenta igual</span>
        </button>
        <button class="btn btn-no ${sel==='no'?'selected':''}" id="btnNo">
          Esta vez no
          <span class="sub">No pasa nada, la semana que viene la retomas</span>
        </button>
        <label class="note-label" for="nota">Nota (solo la ves tú y Gustavo)</label>
        <textarea id="nota" placeholder="¿Algo que quieras contar sobre esta semana?">${thisWeek ? thisWeek.nota : state.noteDraft}</textarea>
        <div class="saved-msg">${state.savedMsg}</div>
      `;
      app.appendChild(card);
      const notaEl = card.querySelector('#nota');
      notaEl.oninput = (e) => { state.noteDraft = e.target.value; state.savedMsg=''; };
      card.querySelector('#btnYes').onclick = () => {
        speak('¡Felicidades! Cumpliste tu meta semanal.');
        saveCheckin('yes', notaEl.value, metaTrimEl.value, metaSemEl.value, identidadEl.value).catch(err => {
          console.error('Fallo no controlado en saveCheckin:', err);
          state.savedMsg = '⚠️ Error inesperado: ' + err.message;
          render();
        });
      };
      card.querySelector('#btnNo').onclick = () => {
        speak('Analiza cuáles crees que son las causas. No te preocupes, ya lo conseguirás la siguiente vez.');
        saveCheckin('no', notaEl.value, metaTrimEl.value, metaSemEl.value, identidadEl.value).catch(err => {
          console.error('Fallo no controlado en saveCheckin:', err);
          state.savedMsg = '⚠️ Error inesperado: ' + err.message;
          render();
        });
      };

      return;
    }

    if(state.view === 'group'){
      const nav = document.createElement('nav');
      nav.className = 'tabs';
      nav.innerHTML = `<button id="toPanel">📋 Panel</button><button id="toCheckin">Mi semana</button><button class="active">Compañeros</button>`;
      app.appendChild(nav);
      nav.querySelector('#toPanel').onclick = () => { state.view='panel'; window.scrollTo(0,0); render(); };
      nav.querySelector('#toCheckin').onclick = () => { state.view='checkin'; window.scrollTo(0,0); render(); };

      app.appendChild(el(`<h1>Registro de los compañeros</h1><p class="lead">${currentWeekLabel}</p>`));

      if(state.loadError){
        app.appendChild(el(`<div class="card" style="border-color:var(--honey);color:var(--ink-soft);font-size:13px">No se pudo conectar con la base de datos. Comprueba tu conexión a internet y vuelve a intentarlo.</div>`));
      }

      const card = document.createElement('div');
      card.className = 'card';
      const visibleMembers = isModerador(state.me)
        ? state.members
        : state.members.filter(m => m === state.me || shareGroup(state.me, m));
      if(visibleMembers.length === 0){
        card.innerHTML = `<div class="empty">Aún no hay nadie en el grupo.</div>`;
      } else {
        card.innerHTML = visibleMembers.map(m => {
          const list = state.checkins[m] || [];
          const entry = list.find(c => c.week === currentWeekShort || c.week === currentWeek);
          const pill = entry
            ? (entry.cumplida ? `<span class="status-pill status-yes">Cumplida ✓</span>` : `<span class="status-pill status-no">Sin cumplir</span>`)
            : `<span class="status-pill status-no">Aún no responde</span>`;
          return `<div class="roster-row"><span class="roster-name">${m}</span>${pill}</div>`;
        }).join('');
      }
      app.appendChild(card);
      return;
    }

    if(state.view === 'manage'){
      app.appendChild(el(`<h1>Gestionar personas</h1><p class="lead">Máximo 10 personas activas en el grupo.</p>`));
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = state.members.map(m => `
        <div class="manage-row"><span style="flex:1">${m}</span><button class="icon-btn" data-name="${m}">✕</button></div>
      `).join('') + (state.members.length === 0 ? '<div class="empty">Todavía no hay nadie.</div>' : '');
      app.appendChild(card);
      card.querySelectorAll('.icon-btn').forEach(b => {
        b.onclick = () => removeMember(b.getAttribute('data-name'));
      });

      if(state.members.length < 10){
        const addRow = document.createElement('div');
        addRow.className = 'manage-row';
        addRow.innerHTML = `<input type="text" id="newName" placeholder="Nombre nuevo"><button class="icon-btn" id="addBtn">＋</button>`;
        app.appendChild(addRow);
        addRow.querySelector('#addBtn').onclick = () => {
          const inp = addRow.querySelector('#newName');
          addMember(inp.value);
          inp.value = '';
        };
        addRow.querySelector('#newName').onkeydown = (e) => {
          if(e.key === 'Enter'){ addMember(e.target.value); e.target.value=''; }
        };
      } else {
        app.appendChild(el(`<p class="cap-note">Has llegado al máximo de 10 personas.</p>`));
      }

      const back = document.createElement('button');
      back.className = 'link-quiet';
      back.textContent = '← Volver';
      back.onclick = () => { state.view = state.me ? 'checkin' : 'pick'; render(); };
      app.appendChild(back);
      return;
    }
  }

  try {
    init();
  } catch(err){
    app.innerHTML = '<div style="padding:24px;font-family:sans-serif">No se pudo iniciar la app: ' + (err && err.message ? err.message : err) + '</div>';
  }
})();
</script>
</body>
</html>
