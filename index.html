        <label class="note-label strong" for="oportunidades">¿Cuántas oportunidades tienes de hacer tu práctica esta semana? (solo el número)</label>
        <input type="number" id="oportunidades" min="0" value="${oportunidadesVal}" placeholder="Ej: 4"
          style="width:100%;border:1px solid var(--border);border-radius:10px;padding:12px;font-family:'Karla';font-size:16px;margin-bottom:16px;background:#FCFCF9;box-sizing:border-box">

        <label class="note-label strong" for="compromisoVeces">¿Cuántas veces te comprometes a hacerlo esta semana? (solo el número)</label>
        <input type="number" id="compromisoVeces" min="0" value="${compromisoVal}" placeholder="Ej: 3"
          style="width:100%;border:1px solid var(--border);border-radius:10px;padding:12px;font-family:'Karla';font-size:16px;margin-bottom:4px;background:#FCFCF9;box-sizing:border-box">
        <p style="font-size:13px;color:var(--ink-soft);margin:0 0 14px">Sin forzarte: elige un número que puedas sostener.</p>

        <button class="btn btn-yes" id="btnRegistrarTodo" style="text-align:center">📲 Registrar y compartir en WhatsApp</button>
        <div class="saved-msg">${state.savedMsg || state.compromisoMsg || ''}</div>
        <button class="link-quiet" id="btnComoCuenta" style="padding:0;margin-top:10px">ℹ️ ¿Cómo cuenta la app mi cumplimiento?</button>
      `;
      app.appendChild(compCard);

      const metaTrimEl = compCard.querySelector('#metaTrim');
      const identidadEl = compCard.querySelector('#identidad');
      const metaSemEl = compCard.querySelector('#metaSem');
      const oportEl = compCard.querySelector('#oportunidades');
      const compEl = compCard.querySelector('#compromisoVeces');

      function limpiarFalta(e){ e.target.classList.remove('campo-falta'); state.compromisoMsg = ''; state.mensajeWhatsApp = ''; }
      metaTrimEl.oninput = (e) => { state.metaTrimDraft = e.target.value; limpiarFalta(e); };
      identidadEl.oninput = (e) => { state.identidadDraft = e.target.value; limpiarFalta(e); };
      const btnMetaSemPrevia = compCard.querySelector('#btnUsarMetaSemPrevia');
      metaSemEl.oninput = (e) => {
        state.metaSemDraft = e.target.value; limpiarFalta(e);
        if(btnMetaSemPrevia) btnMetaSemPrevia.style.display = e.target.value.trim() ? 'none' : 'block';
      };
      if(btnMetaSemPrevia){
        btnMetaSemPrevia.onclick = () => {
          metaSemEl.value = metaSemPrevia;
          state.metaSemDraft = metaSemPrevia;
          metaSemEl.classList.remove('campo-falta');
          btnMetaSemPrevia.style.display = 'none';
          metaSemEl.focus();
          metaSemEl.setSelectionRange(metaSemEl.value.length, metaSemEl.value.length);
        };
      }
      oportEl.oninput = (e) => { state.oportunidadesDraft = e.target.value; limpiarFalta(e); };
      compEl.oninput = (e) => { state.compromisoDraft = e.target.value; limpiarFalta(e); };

      compCard.querySelector('#btnComoCuenta').onclick = () => { state.prevView = 'checkin'; state.view = 'comoCuenta'; window.scrollTo(0,0); render(); };

      // Si acaba de registrar sin pasar por pantalla de resultado, el mensaje sigue a mano
      const tarjetaCheckin = tarjetaCompartir();
      if(tarjetaCheckin) app.appendChild(tarjetaCheckin);

      // Un único guardado: cierra la semana pasada, guarda el compromiso nuevo y comparte
      compCard.querySelector('#btnRegistrarTodo').onclick = () => {
        const hayCierrePendiente = !!compromisoPrev && (!yaCerrada || state.editandoCierre);

        if(hayCierrePendiente && !state.cierreEstado){
          state.compromisoMsg = '⚠️ Marca en el Paso 1 cómo te fue la semana pasada';
          render(); window.scrollTo(0,0); return;
        }
        let realizadas = 0;
        if(hayCierrePendiente && state.cierreEstado === ESTADO_PARCIAL){
          const v = vecesRealEl ? vecesRealEl.value : '';
          if(v === '' || isNaN(Number(v)) || Number(v) < 0){
            state.compromisoMsg = '⚠️ Escribe en el Paso 1 cuántas veces lo hiciste';
            render(); window.scrollTo(0,0); return;
          }
          realizadas = Number(v);
        }
        // Todos los campos del Paso 2 son obligatorios
        const obligatorios = [
          { el: metaTrimEl,   nombre: 'tu meta del trimestre' },
          { el: identidadEl,  nombre: 'tu identidad de meta' },
          { el: metaSemEl,    nombre: 'la frase Cuando…, haré…' },
          { el: oportEl,      nombre: 'las oportunidades que estimas' },
          { el: compEl,       nombre: 'a cuántas veces te comprometes' }
        ];
        compCard.querySelectorAll('.campo-falta').forEach(n => n.classList.remove('campo-falta'));
        const faltan = obligatorios.filter(c => String(c.el.value).trim() === '');
        if(faltan.length){
          faltan.forEach(c => c.el.classList.add('campo-falta'));
          state.compromisoMsg = (faltan.length === 1)
            ? '⚠️ Falta ' + faltan[0].nombre
            : '⚠️ Faltan ' + faltan.length + ' campos por rellenar';
          const msgEl = compCard.querySelector('.saved-msg');
          if(msgEl){ msgEl.textContent = state.compromisoMsg; msgEl.style.color = '#B94A3A'; }
          faltan[0].el.scrollIntoView({ behavior:'smooth', block:'center' });
          faltan[0].el.focus();
          return;
        }
        if(isNaN(Number(compEl.value))){
          state.compromisoMsg = '⚠️ El compromiso tiene que ser un número';
          const msgEl = compCard.querySelector('.saved-msg');
          if(msgEl){ msgEl.textContent = state.compromisoMsg; msgEl.style.color = '#B94A3A'; }
          compEl.classList.add('campo-falta'); compEl.focus();
          return;
        }

        const identidadTxt = identidadEl.value.trim();
        const metaSemTxt = metaSemEl.value.trim();
        const compromisoNum = Number(compEl.value);
        const notaEl2 = document.querySelector('#nota');
        const notaTxt = notaEl2 ? notaEl2.value : '';

        // Estado final del cierre (un parcial completo cuenta como cumplido)
        let estadoFinal = state.cierreEstado;
        if(estadoFinal === ESTADO_PARCIAL && realizadas >= compromisoPrev){
          estadoFinal = ESTADO_CUMPLIDO;
          realizadas = compromisoPrev;
        }

        // Mensaje de WhatsApp: título, 1. semana pasada, 2. esta semana.
        // Los *asteriscos* ponen el texto en negrita dentro de WhatsApp.
        // El grupo 1 sale siempre, para que la numeración no empiece por el 2.
        function lineaResultado(estado, hechas, total){
          if(estado === ESTADO_SIN_OPORTUNIDADES) return '🍃 No se dieron las oportunidades que pensaba';
          const marca = (estado === ESTADO_CUMPLIDO) ? '✅' : '🔸';
          return marca + ' Hice ' + hechas + ' de ' + total;
        }

        let msg = '*MI LUNES DE COMPROMISO AMABLE*\n\n';
        msg += '*1. Semana pasada* (' + rangoSemanaCorto(lastWeekDate) + ')\n';
        if(hayCierrePendiente){
          const hechas = (estadoFinal === ESTADO_CUMPLIDO) ? compromisoPrev : realizadas;
          msg += lineaResultado(estadoFinal, hechas, compromisoPrev) + '\n\n';
        } else if(prevWeek && prevWeek.estadoSemana && Number(prevWeek.compromisoVeces) > 0){
          // Ya se había cerrado antes: se repite el resultado guardado
          const total = Number(prevWeek.compromisoVeces);
          const hechas = (prevWeek.estadoSemana === ESTADO_CUMPLIDO) ? total : (Number(prevWeek.vecesRealizadas) || 0);
          msg += lineaResultado(prevWeek.estadoSemana, hechas, total) + '\n\n';
        } else {
          msg += '— Sin compromiso registrado\n\n';
        }

        msg += '*2. Esta semana* (' + rangoSemanaTexto(today) + ')\n';
        if(identidadTxt) msg += '🪞 ' + identidadTxt + '\n';
        msg += '🎯 Me comprometo a hacerlo ' + compromisoNum + (compromisoNum === 1 ? ' vez' : ' veces') + '.';
        if(metaSemTxt) msg += '\n📌 ' + metaSemTxt;

        // Guardar todo y después compartir
        const tareas = [];
        if(hayCierrePendiente){
          tareas.push(saveCierreSemana(estadoFinal, realizadas, compromisoPrev, notaTxt));
        }
        Promise.all(tareas)
          .then(() => saveCompromisoSemana(oportEl.value, compEl.value, identidadEl.value, metaTrimEl.value, metaSemEl.value))
          .then(() => {
            state.mensajeWhatsApp = msg;
            window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank');
            state.editandoCierre = false;
            if(hayCierrePendiente){
              if(estadoFinal === ESTADO_CUMPLIDO){
                programarCelebracion(FRASES_PRACTI.cumplido, true);
                state.view = 'celebrate';
              } else if(estadoFinal === ESTADO_SIN_OPORTUNIDADES){
                programarCelebracion(FRASES_PRACTI.sinOportunidades, false);
                state.view = 'sinoportunidades';
              } else {
                programarCelebracion(FRASES_PRACTI.parcial, false);
                state.view = 'reflect';
              }
              state.cierreEstado = null;
              state.cierreRealizadas = null;
            }
            window.scrollTo(0,0);
            render();
          })
          .catch(err => {
            console.error('Fallo al registrar:', err);
            state.compromisoMsg = '⚠️ Error al guardar: ' + (err && err.message ? err.message : 'desconocido');
            render();
          });
      };

      return;
    }

    if(state.view === 'comoCuenta'){
      renderBackTopbar('¿Cómo cuenta la app?');
      app.appendChild(el(`
        <div class="card">
          <p style="margin:0 0 14px;font-size:14px;color:var(--ink-soft)">
            Cada lunes cierras la semana que acaba de terminar y defines tu compromiso para la que empieza.
            Así se registra cada caso:
          </p>

          <div class="badge-scale-row"><span><b>Hiciste todas las veces</b></span><span>Suma 1 punto</span></div>
          <p style="font-size:13px;color:var(--ink-soft);margin:-2px 0 12px 2px">
            Cumpliste tu compromiso completo. Suma un punto entero para tu nivel.
          </p>

          <div class="badge-scale-row"><span><b>Lo hiciste algunas veces</b></span><span>Suma esa parte</span></div>
          <p style="font-size:13px;color:var(--ink-soft);margin:-2px 0 12px 2px">
            Suma exactamente lo que hiciste: 3 de 5 suma 0,6 puntos; 4 de 5 suma 0,8.
            Tu esfuerzo real cuenta, no se redondea a cero. En el calendario queda como «3/5».
          </p>

          <div class="badge-scale-row"><span><b>No se dieron las oportunidades</b></span><span>Suma 0,25 puntos</span></div>
          <p style="font-size:13px;color:var(--ink-soft);margin:-2px 0 12px 2px">
            No es un fallo tuyo: la vida no puso las ocasiones. No se vive como incumplimiento
            y sigue sumando una parte, porque tu intención estuvo ahí.
          </p>

          <p style="font-weight:700;margin:16px 0 6px">Cómo se calcula tu nivel</p>
          <p style="font-size:13px;color:var(--ink-soft);margin:0 0 10px">
            Se van sumando esos puntos semana a semana. Cuando el total pasa cada umbral,
            cambias de insignia: Caminante a partir de 10 puntos, Conocedor de Sombras a partir de 30,
            Maestro Integral a partir de 50, Testigo a partir de 70 y Consciencia no dual a partir de 100.
          </p>
          <p style="font-size:13px;color:var(--ink-soft);margin:0">
            Por eso el total puede tener decimales (por ejemplo 12,6 puntos): recoge también
            las semanas que cumpliste a medias. Tu calendario, en cambio, guarda las veces exactas
            de cada semana, para que veas tu recorrido completo y no solo los extremos.
          </p>
        </div>
      `));
      return;
    }

    if(state.view === 'group'){
      const nav = document.createElement('nav');
      nav.className = 'tabs';
      nav.innerHTML = `<button id="toPanel">📋 Panel</button><button id="toCheckin">Registro</button><button class="active">Mi grupo</button>`;
      app.appendChild(nav);
      nav.querySelector('#toPanel').onclick = () => { state.view='panel'; window.scrollTo(0,0); render(); };
      nav.querySelector('#toCheckin').onclick = () => { state.view='checkin'; window.scrollTo(0,0); render(); };

      app.appendChild(el(`<h1>Registro de los compañeros</h1><p class="lead">${currentWeekLabel}</p>`));

      if(state.loadError){
        app.appendChild(el(`<div class="card" style="border-color:var(--honey);color:var(--ink-soft);font-size:13px">No se pudo conectar con la base de datos. Comprueba tu conexión a internet y vuelve a intentarlo.</div>`));
      }

      const card = document.createElement('div');
      card.className = 'card';
      const visibleMembers = isModerador(state.me)
        ? state.members
        : state.members.filter(m => m === state.me || shareGroup(state.me, m));
      if(visibleMembers.length === 0){
        card.innerHTML = `<div class="empty">Aún no hay nadie en el grupo.</div>`;
      } else {
        card.innerHTML = visibleMembers.map(m => {
          const list = state.checkins[m] || [];
          const entry = list.find(c => c.week === currentWeekShort || c.week === currentWeek);
          const pill = entry
            ? (entry.cumplida ? `<span class="status-pill status-yes">Cumplida ✓</span>` : `<span class="status-pill status-no">Sin cumplir</span>`)
            : `<span class="status-pill status-no">Aún no responde</span>`;
          return `<div class="roster-row"><span class="roster-name">${m}</span>${pill}</div>`;
        }).join('');
      }
      app.appendChild(card);
      return;
    }

    if(state.view === 'manage'){
      app.appendChild(el(`<h1>Gestionar personas</h1><p class="lead">Máximo 10 personas activas en el grupo.</p>`));
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = state.members.map(m => `
        <div class="manage-row"><span style="flex:1">${m}</span><button class="icon-btn" data-name="${m}">✕</button></div>
      `).join('') + (state.members.length === 0 ? '<div class="empty">Todavía no hay nadie.</div>' : '');
      app.appendChild(card);
      card.querySelectorAll('.icon-btn').forEach(b => {
        b.onclick = () => removeMember(b.getAttribute('data-name'));
      });

      if(state.members.length < 10){
        const addRow = document.createElement('div');
        addRow.className = 'manage-row';
        addRow.innerHTML = `<input type="text" id="newName" placeholder="Nombre nuevo"><button class="icon-btn" id="addBtn">＋</button>`;
        app.appendChild(addRow);
        addRow.querySelector('#addBtn').onclick = () => {
          const inp = addRow.querySelector('#newName');
          addMember(inp.value);
          inp.value = '';
        };
        addRow.querySelector('#newName').onkeydown = (e) => {
          if(e.key === 'Enter'){ addMember(e.target.value); e.target.value=''; }
        };
      } else {
        app.appendChild(el(`<p class="cap-note">Has llegado al máximo de 10 personas.</p>`));
      }

      const back = document.createElement('button');
      back.className = 'link-quiet';
      back.textContent = '← Volver';
      back.onclick = () => { state.view = state.me ? 'checkin' : 'pick'; render(); };
      app.appendChild(back);
      return;
    }
  }

  try {
    init();
  } catch(err){
    app.innerHTML = '<div style="padding:24px;font-family:sans-serif">No se pudo iniciar la app: ' + (err && err.message ? err.message : err) + '</div>';
  }
})();
</script>
</body>
</html>
