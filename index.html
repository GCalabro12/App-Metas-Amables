<style>
  :root{
    --bg: #FFFFFF;
    --surface: #FFFFFF;
    --ink: #101010;
    --ink-soft: #63625A;
    --border: #E2E1D8;
    --moss: #E8002C;
    --moss-deep: #A8001F;
    --moss-tint: #FCE7EB;
    --honey: #C9942D;
    --honey-tint: #FAF0DC;
    --leaf: #E8002C;
    --radius: 14px;
  }
  body.theme-dark{
    --bg: #17181B;
    --surface: #1F2024;
    --ink: #F2F1EC;
    --ink-soft: #B5B3A8;
    --border: #34353A;
    --honey-tint: #3A2F1A;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Karla', sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    transition: background .2s ease, color .2s ease;
  }
  .app{
    max-width: 480px;
    margin: 0 auto;
    padding: 28px 20px 60px;
    min-height: 100vh;
  }
  @media (min-width: 900px){
    .app{ max-width: 720px; padding: 40px 32px 80px; }
    .cal-grid{ gap: 8px; }
  }
  @media (min-width: 1300px){
    .app{ max-width: 860px; }
  }
  .wordmark{
    font-family: 'Lora', serif;
    font-weight: 600;
    font-size: 22px;
    color: var(--moss-deep);
    letter-spacing: -0.01em;
  }
  .wordmark span{ color: var(--ink-soft); font-weight: 400; font-size: 15px; display:block; margin-top: 2px; font-family:'Karla',sans-serif; }
  .version-tag{
    color: var(--ink-soft); font-weight:400; font-size:11px; letter-spacing:.06em;
    font-family:'Karla',sans-serif; vertical-align:middle; margin-left:4px;
  }
  .brand-row{ display:flex; align-items:center; gap:10px; }
  .brand-icon{ width:34px; height:34px; border-radius:50%; object-fit:cover; flex-shrink:0; }
  .brand-hero{ width:100%; max-width:340px; height:auto; display:block; margin: 4px auto 22px; }
  
  header.top{
    display:flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 28px;
  }
  .who{
    text-align:right;
    font-size: 14px;
    color: var(--ink-soft);
  }
  .who .greeting{
    font-family: 'Lora', serif;
    font-size: 20px;
    font-weight: 600;
    color: var(--ink);
    display:block;
    line-height: 1.2;
  }
  .who button{
    background:none; border:none; color: var(--moss); font-family:'Karla'; font-size:13px;
    text-decoration: underline; cursor:pointer; padding: 2px 0; margin-top:2px;
  }
  h1{ font-family:'Lora',serif; font-size: 26px; font-weight:600; margin: 0 0 6px; color: var(--ink); line-height:1.25;}
  p.lead{ color: var(--ink-soft); font-size: 15px; line-height:1.5; margin: 0 0 24px; }

  /* Name picker */
  .grid-names{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 22px;
  }
  .name-card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 14px;
    font-family: 'Karla';
    font-size: 15px;
    font-weight: 500;
    color: var(--ink);
    cursor: pointer;
    text-align: left;
    transition: border-color .15s ease, background .15s ease;
  }
  .name-card:hover{ border-color: var(--moss); background: var(--moss-tint); }
  .name-card:active{ transform: translateY(1px); }

  .link-quiet{
    display:inline-block;
    color: var(--ink-soft);
    font-size: 14px;
    text-decoration: underline;
    cursor: pointer;
    background:none; border:none; font-family:'Karla'; padding: 6px 0;
  }
  .link-quiet:hover{ color: var(--moss-deep); }

  /* Card / section */
  .card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
    margin-bottom: 18px;
    box-shadow: 0 1px 3px rgba(20,20,10,.04), 0 4px 14px rgba(20,20,10,.03);
  }
  .avance-trimestre{
    display:inline-block; font-size:12.5px; font-weight:700; color:var(--moss-deep);
    background:var(--moss-tint); border-radius:8px; padding:5px 10px; margin-bottom:10px;
  }
  .week-label{
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 6px;  }
  .question{
    font-family:'Lora', serif;
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 18px;
    line-height:1.35;
  }
  .btn{
    width:100%;
    display:block;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    font-family:'Karla';
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 10px;
    text-align: left;
    transition: all .15s ease;
    color: var(--ink);
    box-shadow: 0 1px 2px rgba(20,20,10,.03);
  }
  .btn .sub{ display:block; font-weight:400; font-size:13px; color:var(--ink-soft); margin-top:2px;}
  .btn-yes{ border-color: var(--moss); }
  .btn-yes:hover{ background: var(--moss); color: #fff; }
  .btn-yes:hover .sub{ color: #DCE9DD; }
  .btn-no{ border-color: var(--honey); }

<body>
<div class="app" id="app"></div>

<script>
(function(){
  const app = document.getElementById('app');
  let state = {
    view: 'loading',
    me: null,
    members: [],
    checkins: {},
    passwords: {},
    panelUrls: {},
    groups: {},
    guiaUrl: '',
    guiaTexto: '',
    miValoracion: null,
    valoracionMsg: '',
    sesionesTexto: '',
    loginError: '',
    loginView: 'login',
    selection: null,
    noteDraft: '',
    metaTrimDraft: '',
    metaSemDraft: '',
    identidadDraft: '',
    saving: false,
    savedMsg: '',
    metaSavedMsg: '',
    menuOpen: false,
    theme: localStorage.getItem('mac_theme') || 'light',
    lang: localStorage.getItem('mac_lang') || 'es',
    prevView: 'panel',
    nivel: null,
    cierreEstado: null,
    cierreRealizadas: null,
    editandoCierre: false,
    oportunidadesDraft: null,
    compromisoDraft: null,
    compromisoMsg: ''
  };

  function applyTheme(){
    document.body.classList.toggle('theme-dark', state.theme === 'dark');
  }

  const BADGE_SCALE = [
    { min: 0,   label: 'Aprendiz',              icon:'🌱' },
    { min: 10,  label: 'Caminante',              icon:'🚶' },
    { min: 30,  label: 'Conocedor de Sombras',   icon:'🌗' },
    { min: 50,  label: 'Maestro Integral',       icon:'⚖️' },
    { min: 70,  label: 'Testigo',                icon:'👁️' },
    { min: 100, label: 'Consciencia no dual',    icon:'✨' }
  ];
  function nivelBadgeHTML(){
    if(!state.nivel) return '';
    return `<button id="nivelBadgeBtn" class="nivel-badge-mini" title="Tu nivel: ${state.nivel.label}">${state.nivel.icon}</button>`;
  }

  // Días que faltan hasta el próximo lunes de compromiso (0 si hoy es lunes)
  function diasHastaLunes(){
    const dow = today.getDay(); // 0 = domingo, 1 = lunes
    if(dow === 1) return 0;
    return (8 - dow) % 7;
  }

  function avisoLunesHTML(){
    const d = diasHastaLunes();
    if(d === 0) return '📝 <b>Hoy es el lunes de compromiso.</b>';
    if(d === 1) return '📝 <b>Falta 1 día para el lunes de compromiso.</b>';
    return '📝 <b>Faltan ' + d + ' días para el lunes de compromiso.</b>';
  }

  // Escapa texto que va dentro de un atributo HTML (una comilla rompería el marcado)
  function escapeAttr(s){
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/"/g, '&quot;')
      .replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // Los puntos pueden tener decimales (ej. 3,75) porque los parciales suman una fracción
  function fmtPuntos(n){
    const num = Number(n) || 0;
    return num.toFixed(2).replace(/\.?0+$/, '').replace('.', ',');
  }

  function insigniaActual(n){
    let res = BADGE_SCALE[0];
    for(const b of BADGE_SCALE){ if(n >= b.min) res = b; }
    return res;
  }

  // Carga el nivel/insignia actual del practicante logueado (para el badge del panel y Mi perfil)
  function cargarNivel(name){
    const formula = encodeURIComponent(`{Name} = "${name}"`);
    fetch(GAMIFICA_URL + '?filterByFormula=' + formula, { headers: airHeaders() })
      .then(res => { if(!res.ok) throw new Error('Airtable ' + res.status); return res.json(); })
      .then(data => {
        const rec = data.records && data.records[0];
        if(!rec){ state.nivel = null; return; }
        const cumplidas = rec.fields['Cumplidas semanas'] || 0;
        const actual = insigniaActual(cumplidas);
        const insigniaTexto = rec.fields['Insignia'] || actual.label;
        state.nivel = { icon: actual.icon, label: insigniaTexto, min: actual.min, cumplidas };
        if(state.view === 'panel' || state.view === 'perfil') render();
      })
      .catch(err => { console.error('Error cargando nivel:', err); });
  }

  function isoWeek(d){
    const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    const dayNum = (date.getUTCDay() + 6) % 7;
    date.setUTCDate(date.getUTCDate() - dayNum + 3);
    const firstThursday = new Date(Date.UTC(date.getUTCFullYear(),0,4));
    const weekNum = 1 + Math.round(((date - firstThursday) / 86400000 - 3 + ((firstThursday.getUTCDay()+6)%7)) / 7);
    return date.getUTCFullYear() + '-W' + String(weekNum).padStart(2,'0');
  }

  function weekLabel(d){
    const day = (d.getDay()+6)%7;
    const monday = new Date(d); monday.setDate(d.getDate() - day);
    const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
    const opts = {day:'numeric', month:'long'};
    return 'Semana del ' + monday.toLocaleDateString('es-ES',{day:'numeric'}) + ' al ' + sunday.toLocaleDateString('es-ES', opts);
  }

  function weekShort(d){
    const day = (d.getDay()+6)%7;
    const monday = new Date(d); monday.setDate(d.getDate() - day);
    const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
    const m = monday.toLocaleDateString('es-ES',{month:'short'}).replace('.','');
    return monday.getDate() + '-' + sunday.getDate() + ' ' + m + ' ' + monday.getFullYear();
  }

  // "del 7 al 13 de septiembre" — para los encabezados de los pasos
  function rangoSemanaTexto(d){
    const day = (d.getDay()+6)%7;
    const monday = new Date(d); monday.setDate(d.getDate() - day);
    const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
    const mesLunes = monday.toLocaleDateString('es-ES',{month:'long'});
    const mesDomingo = sunday.toLocaleDateString('es-ES',{month:'long'});
    if(mesLunes === mesDomingo){
      return 'del ' + monday.getDate() + ' al ' + sunday.getDate() + ' de ' + mesDomingo;
    }
    return 'del ' + monday.getDate() + ' de ' + mesLunes + ' al ' + sunday.getDate() + ' de ' + mesDomingo;
  }

  const today = new Date();

  const currentWeekShort = weekShort(today);

  // Estados posibles de una semana (deben coincidir EXACTO con las opciones del

    if(c.estadoSemana === ESTADO_SIN_OPORTUNIDADES) return PCT_SIN_OPORTUNIDADES;

  // Trimestre actual

  // Calcular todas las semanas (lunes) del trimestre actual
  function getQuarterWeeks(){
    const qStart = new Date(today.getFullYear(), (currentQ-1)*3, 1);
    const qEnd = new Date(today.getFullYear(), currentQ*3, 0); // último día del trimestre
    const weeks = [];
    // Buscar el primer lunes del trimestre (o el lunes anterior si el 1 no es lunes)
    const d = new Date(qStart);
    const dayOfWeek = (d.getDay()+6)%7; // 0=lunes
    d.setDate(d.getDate() - dayOfWeek); // retroceder al lunes
    while(d <= qEnd){
      weeks.push({
        iso: isoWeek(d),
        short: weekShort(d),
        month: d.toLocaleDateString('es-ES',{month:'short'}).replace('.','')

  // Posición de la semana actual dentro del trimestre: "Semana 3 de 13"

  function avanceTrimestre(){

    if(indice === -1) indice = quarterWeeks.findIndex(w => w.iso === currentWeek);

  // Calcular las semanas (lunes) que caen dentro de un mes concreto, en filas completas por semana
  function getMonthWeeks(year, monthIndex){
    const mStart = new Date(year, monthIndex, 1);
    const mEnd = new Date(year, monthIndex+1, 0);
    const weeks = [];
    const seen = new Set();
    const d = new Date(mStart);
    const dayOfWeek = (d.getDay()+6)%7;
    d.setDate(d.getDate() - dayOfWeek);
    while(d <= mEnd){
      // Solo contamos la semana como "de este mes" si su lunes cae en este mes,
      // o si es la primera semana del mes (lunes en mes anterior pero contiene días de este mes)
      const key = isoWeek(d);
      if(!seen.has(key)){
        seen.add(key);
        weeks.push({ iso: key, short: weekShort(d) });
      }
      d.setDate(d.getDate() + 7);
    }
    return weeks;
  }

  const monthNamesEs = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

  // Género de cada practicante, para "Bienvenido/a". Añade aquí los nombres nuevos que hagan falta.
  const GENERO = { 'Gustavo':'m', 'Rafael':'m', 'Empar':'f', 'Rosa':'f', 'Shayo':'f', 'Ana María':'f' };
  function bienvenidaTexto(name){

  // Interpreta líneas de texto tipo "7 de septiembre" y devuelve {day, monthIdx, year}
  function nombreMesAIdx(nombreLower){
    const quitarAcentos = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    const plain = quitarAcentos(nombreLower.toLowerCase());
    for(let i = 0; i < monthNamesEs.length; i++){
      if(quitarAcentos(monthNamesEs[i]) === plain) return i;
    }
    return null;
  }

  // Parte el texto largo de la guía en bloques por cada línea "#Semana N Mes"
  function parseGuiaSemanas(text){
    if(!text) return [];
    const lines = text.split('\n');
    const weekHeaderRe = /^#?\s*semana\s+(\d+)\s+([a-záéíóúñ]+)/i;
    const blocks = [];
    let current = null;
    lines.forEach(line => {
      const m = line.trim().match(weekHeaderRe);
      if(m){
        if(current) blocks.push(current);
        current = { weekNum: parseInt(m[1],10), monthName: m[2], lines: [] };
      } else if(current){
        current.lines.push(line);
      }
    });
    if(current) blocks.push(current);

    return blocks.map(b => {
      const monthIdx = nombreMesAIdx(b.monthName);
      const mIdx = monthIdx === null ? today.getMonth() : monthIdx;
      let year = today.getFullYear();
      if(mIdx < today.getMonth() - 6) year += 1;
      return {
        weekNum: b.weekNum,
        monthName: monthNamesEs[mIdx],
        monthIdx: mIdx,
        year: year,
        text: b.lines.join('\n').trim()
      };
    }).sort((a,b) => (a.year-b.year) || (a.monthIdx-b.monthIdx) || (a.weekNum-b.weekNum));
  }

  // ¿Está desbloqueada esta semana, según la fecha de hoy?
  // Las semanas se cuentan como bloques de 7 días desde el día 1 del mes:
  // Semana 1 = días 1-7, Semana 2 = días 8-14, Semana 3 = días 15-21, Semana 4 = días 22-28, etc.
  function rangoSemana(block){
    const inicioDia = (block.weekNum - 1) * 7 + 1;
    const finDia = block.weekNum * 7;
    const inicio = new Date(block.year, block.monthIdx, inicioDia);
    const finExclusivo = new Date(block.year, block.monthIdx, finDia + 1);
    return { inicio, finExclusivo };
  }

  function semanaDesbloqueada(block){
    const { inicio } = rangoSemana(block);
    const hoyMedianoche = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    return hoyMedianoche >= inicio;
  }

  function esSemanaActual(block){
    const { inicio, finExclusivo } = rangoSemana(block);
    const hoyMedianoche = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    return hoyMedianoche >= inicio && hoyMedianoche < finExclusivo;
  }

  // Convertidor ligero de **negrita**, *cursiva* y enlaces a HTML, respetando párrafos
  function miniMarkdown(text){
    const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    let out = esc(text);
    out = out.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" style="color:var(--moss-deep)">$1</a>');
    out = out.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
    out = out.replace(/\*(.+?)\*/g, '<em>$1</em>');
    out = out.split(/\n\s*\n/).map(p => p.trim()).filter(Boolean).map(p => `<p style="margin:0 0 10px">${p.replace(/\n/g,'<br>')}</p>`).join('');
    return out;
  }

  function parseSesionesFechas(text){
    if(!text) return [];
    const quitarAcentos = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
    const out = [];
    lines.forEach(line => {
      const lower = quitarAcentos(line.toLowerCase());
      const dayMatch = lower.match(/(\d{1,2})/);
      if(!dayMatch) return;
      const day = parseInt(dayMatch[1], 10);
      let monthIdx = null;
      for(let i = 0; i < monthNamesEs.length; i++){
        if(lower.includes(quitarAcentos(monthNamesEs[i]))){ monthIdx = i; break; }
      }
      if(monthIdx === null) monthIdx = today.getMonth();
      let year = today.getFullYear();
      // Si el mes ya quedó muy atrás en el año (más de 6 meses), asumimos que es del año siguiente
      if(monthIdx < today.getMonth() - 6) year += 1;
      out.push({ day, monthIdx, year, raw: line });
    });
    return out;
  }

  function buildMonthGrid(year, monthIndex){
    const firstDay = new Date(year, monthIndex, 1);
    const daysInMonth = new Date(year, monthIndex+1, 0).getDate();
    const startOffset = (firstDay.getDay()+6)%7; // 0=lunes
    const cells = [];
    for(let i=0;i<startOffset;i++) cells.push(null);
    for(let d=1; d<=daysInMonth; d++) cells.push(d);
    while(cells.length % 7 !== 0) cells.push(null);
    const weeks = [];
    for(let i=0;i<cells.length;i+=7) weeks.push(cells.slice(i,i+7));
    return weeks;
  }

  function renderSesionesCalendario(text){
    const sesiones = parseSesionesFechas(text);
    // Agrupar sesiones encontradas por mes/año
    const groups = {};
    sesiones.forEach(s => {
      const key = s.year + '-' + s.monthIdx;
      if(!groups[key]) groups[key] = { year: s.year, monthIdx: s.monthIdx, days: [] };
      groups[key].days.push(s.day);
    });
    // Rango fijo siempre visible: mes anterior + actual + 3 siguientes (5 meses)
    for(let offset = -1; offset <= 3; offset++){
      const totalMonth = today.getMonth() + offset;
      const y = today.getFullYear() + Math.floor(totalMonth / 12);
      const m = ((totalMonth % 12) + 12) % 12;
      const key = y + '-' + m;
      if(!groups[key]) groups[key] = { year: y, monthIdx: m, days: [] };
    }
    const sortedKeys = Object.keys(groups).sort((a,b) => {
      const ga = groups[a], gb = groups[b];
      return (ga.year - gb.year) || (ga.monthIdx - gb.monthIdx);
    });
    const todayY = today.getFullYear(), todayM = today.getMonth(), todayD = today.getDate();
    let html = '';
    if(sesiones.length === 0){
      html += '<div style="font-size:13px;color:var(--ink-soft);margin-bottom:10px">Aún no hay fechas publicadas.</div>';
    }
    sortedKeys.forEach(key => {
      const g = groups[key];
      const weeks = buildMonthGrid(g.year, g.monthIdx);
      html += `<div style="margin-bottom:20px">`;
      html += `<div class="sescal-mes">${monthNamesEs[g.monthIdx]} ${g.year}</div>`;
      html += `<div class="sescal-dias-header">
        <div>L</div><div>M</div><div>X</div><div>J</div><div>V</div><div>S</div><div>D</div></div>`;
      weeks.forEach(week => {
        html += `<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px">`;
        week.forEach(day => {
          if(day === null){ html += `<div></div>`; return; }
          const isToday = (g.year===todayY && g.monthIdx===todayM && day===todayD);
          const isSesion = g.days.includes(day);
          let cellDate = new Date(g.year, g.monthIdx, day);
          let cellToday = new Date(todayY, todayM, todayD);
          const isPast = cellDate < cellToday;
          let circleColor = '';
          if(isSesion) circleColor = isPast ? '#B94A3A' : '#4C8C5C';
          const bgStyle = isSesion ? `background:${circleColor};color:#fff;` : '';
          if(isToday){
            html += `<div class="sescal-celda sescal-hoy" style="${bgStyle}">
              <span class="sescal-label-hoy">HOY</span><span class="sescal-num">${day}</span>
            </div>`;
          } else {
            html += `<div class="sescal-celda" style="border-radius:50%;font-weight:${isSesion?'700':'400'};${bgStyle}">
              <span class="sescal-num">${day}</span>
            </div>`;
          }
        });
        html += `</div>`;
      });
      html += `</div>`;
    });
    html += `<div style="display:flex;gap:14px;font-size:11px;color:var(--ink-soft);margin-top:6px;flex-wrap:wrap">
      <span>⬤ <span style="color:#4C8C5C">Sesión futura</span></span>
      <span>⬤ <span style="color:#B94A3A">Sesión pasada</span></span>
      <span>▢ <span>Hoy</span></span>
    </div>`;
    return html;
  }

  function cleanUrl(raw){
    if(!raw) return '';
    let s = String(raw).trim();
    // Si el texto contiene "http" más de una vez, nos quedamos solo con la primera URL
    const firstIdx = s.indexOf('http');
    if(firstIdx === -1) return s;
    const secondIdx = s.indexOf('http', firstIdx + 4);
    if(secondIdx !== -1){
      s = s.slice(firstIdx, secondIdx);
    } else {
      s = s.slice(firstIdx);
    }
    return s.trim();
  }

  async function changePassword(currentPass, newPass){
    currentPass = (currentPass||'').trim();
    newPass = (newPass||'').trim();
    if(!currentPass || !newPass){ state.loginError = 'Rellena ambos campos'; render(); return; }
    if(newPass.length < 3){ state.loginError = 'La nueva contraseña debe tener al menos 3 caracteres'; render(); return; }
    const found = Object.entries(state.passwords).find(([name, p]) => p === currentPass);
    if(!found){ state.loginError = 'Contraseña actual incorrecta'; render(); return; }
    const userName = found[0];
    const records = state.checkins[userName] || [];
    try {
      for(const rec of records){
        if(rec.id){
          const fields = {}; fields[AIR.fields.pass] = newPass;
          await fetch(AIR_URL + '/' + rec.id, { method:'PATCH', headers:airHeaders(), body:JSON.stringify({fields}) });

  // Escritura tolerante: si Airtable rechaza un campo que no existe (o una opción
  // de desplegable que no está creada), lo omite y reintenta en vez de fallar todo.
  // Así un nombre de campo cambiado en Airtable nunca deja al practicante sin guardar.
  async function airWrite(url, method, fieldsOriginales){
    const fields = Object.assign({}, fieldsOriginales);
    const omitidos = [];
    for(let intento = 0; intento < 6; intento++){
      const res = await fetch(url, { method, headers: airHeaders(), body: JSON.stringify({ fields }) });
      if(res.ok){
        const data = await res.json();
        if(omitidos.length) console.warn('Campos omitidos (no existen en Airtable):', omitidos.join(', '));
        return data;
      }
      const txt = await res.text().catch(() => '');
      if(res.status === 422){
        const desconocido = txt.match(/Unknown field name:\s*"?([^"\\}]+)"?/i);
        if(desconocido){
          const nombre = desconocido[1].trim();
          const clave = Object.keys(fields).find(k => k === nombre);
          if(clave){ delete fields[clave]; omitidos.push(clave); continue; }
        }
        // Opción de desplegable inexistente: se omite ese campo y se sigue
        if(/select option|INVALID_MULTIPLE_CHOICE/i.test(txt) && fields[AIR.fields.estadoSemana] !== undefined){
          omitidos.push(AIR.fields.estadoSemana);
          delete fields[AIR.fields.estadoSemana];
          continue;
        }
      }
      throw new Error('Airtable ' + res.status + ': ' + txt.slice(0, 200));
    }
    throw new Error('No se pudo guardar: demasiados campos no reconocidos en Airtable');
  }

  // ===== Paso 1: cierre de la semana PASADA =====

  async function saveCierreSemana(estado, realizadas, compromiso, nota){
    state.savedMsg = 'Guardando…';
    render();
    try {
      const list = await ensureCheckins(state.me);
      const prev = list.find(c => c.week === lastWeekShort);

      const fields = {};
      fields[AIR.fields.alumno] = state.me;
      fields[AIR.fields.semana] = lastWeekShort;
      fields[AIR.fields.estadoSemana] = estado;
      fields[AIR.fields.notas] = (nota || '').trim();
      if(estado === ESTADO_CUMPLIDO) fields[AIR.fields.vecesRealizadas] = compromiso;
      else if(estado === ESTADO_PARCIAL) fields[AIR.fields.vecesRealizadas] = realizadas;
      else fields[AIR.fields.vecesRealizadas] = 0;
      if(compromiso > 0) fields[AIR.fields.compromisoVeces] = compromiso;
      fields[AIR.fields.pass] = state.passwords[state.me] || '';
      if(state.groups[state.me] && state.groups[state.me].length) fields[AIR.fields.grupo] = state.groups[state.me];

      if(prev && prev.id){
        await airWrite(AIR_URL + '/' + prev.id, 'PATCH', fields);
        prev.estadoSemana = estado;
        prev.cumplida = (estado === ESTADO_CUMPLIDO);
        prev.nota = fields[AIR.fields.notas];
        prev.vecesRealizadas = fields[AIR.fields.vecesRealizadas];
        if(compromiso > 0) prev.compromisoVeces = compromiso;
      } else {
        const data = await airWrite(AIR_URL, 'POST', fields);
        list.push({
          id: data.id, week: lastWeekShort, label: lastWeekLabel,

          estadoSemana: estado,
          compromisoVeces: compromiso > 0 ? compromiso : null,
          vecesRealizadas: fields[AIR.fields.vecesRealizadas],
          metaTrim: '', metaSem: '', identidad: ''
        });
      }
      state.savedMsg = 'Guardado ✓';
      state.cierreHecho = true;
      cargarNivel(state.me);

    render();

  // Cambio de contraseña desde dentro de la app (usuario ya logueado)
  async function cambiarPasswordDesdePerfil(currentPass, newPass, msgEl){
    currentPass = (currentPass||'').trim();
    newPass = (newPass||'').trim();
    if(!currentPass || !newPass){ msgEl.style.color='#B94A3A'; msgEl.textContent='Rellena ambos campos'; return; }
    if(newPass.length < 3){ msgEl.style.color='#B94A3A'; msgEl.textContent='La nueva contraseña debe tener al menos 3 caracteres'; return; }
    if(state.passwords[state.me] !== currentPass){ msgEl.style.color='#B94A3A'; msgEl.textContent='Contraseña actual incorrecta'; return; }
    const records = state.checkins[state.me] || [];
    try {
      for(const rec of records){
        if(rec.id){
          const fields = {}; fields[AIR.fields.pass] = newPass;
          await fetch(AIR_URL + '/' + rec.id, { method:'PATCH', headers:airHeaders(), body:JSON.stringify({fields}) });
        }
      }
      state.passwords[state.me] = newPass;
      msgEl.style.color = 'var(--moss-deep)';
      msgEl.textContent = 'Contraseña cambiada ✓';
    } catch(e){
      msgEl.style.color='#B94A3A'; msgEl.textContent='No se pudo cambiar (revisa tu conexión)';
    }
  }

        let inner = `<div class="cal-month-title">${mObj.label}</div><div class="cal-grid" style="grid-template-columns:repeat(${cols},1fr)">`;
        mObj.weeks.forEach((qw, i) => {
          const c = checkinMap[qw.short] || checkinMap[qw.iso] || null;
          const pct = pctDeSemana(c);
          let cls = '', mark = '—';
          if(c && c.estadoSemana === ESTADO_SIN_OPORTUNIDADES){
            cls = 'low'; mark = '🍃';
          } else if(c && c.estadoSemana){
            const comp = Number(c.compromisoVeces);
            const real = Number(c.vecesRealizadas);
            const hechas = (c.estadoSemana === ESTADO_CUMPLIDO) ? comp : (real || 0);
            if(comp > 0) mark = hechas + '/' + comp;
            else if(real > 0) mark = String(real);   // hay veces hechas pero no se guardó el compromiso
            else mark = c.cumplida ? '✓' : '·';      // marcada a mano, sin números
            if(pct !== null && pct >= 100) cls = 'yes';
            else if(pct !== null && pct > PCT_SIN_OPORTUNIDADES) cls = 'partial';
            else cls = 'low';
          } else if(c && c.cumplida){
            // Semanas antiguas, anteriores a este sistema
            cls = 'yes'; mark = '✓';
          }
          const dayRange = qw.short.split(' ')[0];
          inner += `<div class="cal-cell ${cls}"><span class="cal-label">${dayRange}</span><span class="cal-mark">${mark}</span></div>`;
        });
        inner += `</div>`;
        monthCard.innerHTML = inner;
        app.appendChild(monthCard);
      });
      return;
    }

        </div>
      `));
      return;
    }

            <details class="acc" style="background:#fff">
              <summary style="color:#7B4FA6">Módulo Espiritual — Propósito y presencia</summary>
              <div class="acc-body">
                🔹 <b>Desarrollo del propósito:</b> reflexiona sobre lo que da significado a tu vida.<br>
                🔹 <b>Prácticas de atención plena:</b> meditación, respiración consciente, gratitud.<br>
                🔹 <b>Conexión trascendental:</b> naturaleza, espiritualidad, servicio a los demás.<br>
                📌 <b>Ejercicio clave:</b> escribe tu propósito de vida en 1-2 frases y revísalo cada semana.
              </div>
            </details>
            <details class="acc" style="background:#fff">
              <summary style="color:#C77B1E">Módulo Mental — Aprendizaje y mentalidad de crecimiento</summary>
              <div class="acc-body">
                🔹 <b>Curiosidad activa:</b> cuestionar, leer, explorar cosas nuevas.<br>
                🔹 <b>Desarrollo de habilidades:</b> elige una habilidad y avanza con disciplina.<br>
                🔹 <b>Diversidad de pensamiento:</b> exponte a ideas y perspectivas distintas.<br>
                📌 <b>Ejercicio clave:</b> escoge un tema nuevo cada mes y aprende sobre él.
              </div>
            </details>
            <details class="acc" style="background:#fff">
              <summary style="color:#B8960C">Módulo Emocional — Gestión emocional y aceptación</summary>
              <div class="acc-body">
                🔹 <b>Conciencia emocional:</b> reconoce y nombra lo que sientes sin juzgarlo.<br>
                🔹 <b>Regulación emocional:</b> estrategias saludables para el estrés o la tristeza.<br>
                🔹 <b>Aceptar todas las emociones:</b> no suprimirlas, aprender de ellas.<br>
                📌 <b>Ejercicio clave:</b> escribe un diario emocional 5 minutos al final del día.
              </div>
            </details>
            <details class="acc" style="background:#fff">

              <div class="acc-body">
                🔹 <b>Ejercicio regular:</b> una actividad física que disfrutes, con constancia.<br>
                🔹 <b>Sueño y descanso:</b> horario regular, menos pantallas antes de dormir.<br>
                🔹 <b>Nutrición consciente:</b> alimentos naturales, escuchar hambre y saciedad.<br>
                📌 <b>Ejercicio clave:</b> diseña una rutina con 20 min de movimiento, 7-8h de sueño y comidas balanceadas.
              </div>
            </details>

                🔹 <b>Conexión genuina:</b> escucha activa, empatía, gratitud.<br>
                📌 <b>Ejercicio clave:</b> envía un mensaje sincero de agradecimiento cada semana.

            <span class="sub">Lo que sí hiciste suma puntos igual</span>
          </button>

          <div id="parcialBox" style="display:${est === ESTADO_PARCIAL ? 'block' : 'none'};margin-top:12px">
            <label class="parcial-label" for="vecesReal">Hice <input type="number" id="vecesReal" min="0" max="${compromisoPrev}" value="${realizadasVal}" placeholder="0"> de las ${compromisoPrev}</label>
            <div id="pctPreview" style="font-size:13px;color:var(--ink-soft);margin-top:8px"></div>
          </div>

          <label class="note-label" for="nota" style="margin-top:14px">Nota (solo la ves tú y Gustavo)</label>
          <textarea id="nota" placeholder="¿Algo que quieras contar sobre esta semana?">${prevWeek && prevWeek.nota ? prevWeek.nota : state.noteDraft}</textarea>
        `;
        app.appendChild(cierreCard);

        const notaEl = cierreCard.querySelector('#nota');
        notaEl.oninput = (e) => { state.noteDraft = e.target.value; state.savedMsg = ''; };

        const parcialBox = cierreCard.querySelector('#parcialBox');
        vecesRealEl = cierreCard.querySelector('#vecesReal');
        const pctPreview = cierreCard.querySelector('#pctPreview');

        function actualizarPreview(){
          const n = Number(vecesRealEl.value);
          if(vecesRealEl.value === '' || isNaN(n)){ pctPreview.textContent = ''; return; }
          const pct = compromisoPrev > 0 ? Math.round((n / compromisoPrev) * 100) : 0;
          const suma = compromisoPrev > 0 ? Math.min(n / compromisoPrev, 1) : 0;
          const sumaTxt = suma.toFixed(2).replace(/\.?0+$/, '').replace('.', ',');
          pctPreview.textContent = 'Has hecho el ' + pct + '% de tu compromiso · suma ' + sumaTxt + ' puntos.';
        }
        vecesRealEl.oninput = () => { state.cierreRealizadas = vecesRealEl.value; actualizarPreview(); };
        actualizarPreview();

        cierreCard.querySelector('#btnCierreTotal').onclick = () => {
          state.cierreEstado = ESTADO_CUMPLIDO; state.savedMsg = ''; render();
        };
        cierreCard.querySelector('#btnCierreSinOp').onclick = () => {
          state.cierreEstado = ESTADO_SIN_OPORTUNIDADES; state.savedMsg = ''; render();
        };
        cierreCard.querySelector('#btnCierreParcial').onclick = () => {
          state.cierreEstado = ESTADO_PARCIAL; state.savedMsg = '';
          parcialBox.style.display = 'block';
          render();
          const el2 = document.querySelector('#vecesReal');
          if(el2) el2.focus();
        };
      }

      // ===== PASO 2: Compromiso para la nueva semana =====
      const oportunidadesVal = (state.oportunidadesDraft !== null && state.oportunidadesDraft !== undefined)
        ? state.oportunidadesDraft
        : ((thisWeek && thisWeek.oportunidades !== null && thisWeek.oportunidades !== undefined) ? thisWeek.oportunidades : '');
      const compromisoVal = (state.compromisoDraft !== null && state.compromisoDraft !== undefined)
        ? state.compromisoDraft
        : ((thisWeek && thisWeek.compromisoVeces !== null && thisWeek.compromisoVeces !== undefined) ? thisWeek.compromisoVeces : '');

      const compCard = document.createElement('div');
      compCard.className = 'card';
      compCard.innerHTML = `
        <div class="question" style="font-size:19px;margin-bottom:4px">Paso 2️⃣ Tu compromiso para esta semana</div>
        <div class="week-label">${rangoSemanaTexto(today)}</div>
        ${avanceTrimestreTexto() ? `<div class="avance-trimestre">📊 ${avanceTrimestreTexto()}</div>` : ''}

        <label class="note-label strong" for="metaTrim" style="margin-top:14px">🎯 Meta ${currentQLabel} (${currentQMonths.join(', ')})</label>
        <textarea id="metaTrim" placeholder="¿Cuál es tu meta para este trimestre?" style="min-height:44px;margin-bottom:16px">${curMetaTrim}</textarea>

        <label class="note-label strong" for="identidad">🪞 Mi identidad de meta</label>
        <p style="font-size:13px;color:var(--ink-soft);margin:0 0 6px">
          Escríbela de nuevo cada semana: reescribirla ayuda a interiorizarla y a reconocerte en ella.
        </p>
        <textarea id="identidad" placeholder="${identidadPrevia ? escapeAttr(identidadPrevia) : 'Ej: María, la que hace yoga cuatro veces por semana'}" style="min-height:44px;margin-bottom:16px">${curIdentidad}</textarea>
        ${identidadPrevia ? `<p style="font-size:12px;color:var(--ink-soft);margin:-12px 0 16px">En gris tienes la que escribiste la semana pasada, por si te sirve de punto de partida.</p>` : ''}

        <label class="note-label strong" for="metaSem">¿Cuándo y cómo lo harás esta semana?</label>
        <textarea id="metaSem" placeholder="Ej: lunes y jueves a las 7h, antes de desayunar" style="min-height:44px;margin-bottom:16px">${curMetaSem}</textarea>

        <label class="note-label strong" for="oportunidades">¿Cuántas oportunidades tienes de hacer tu práctica esta semana? (solo el número)</label>
        <input type="number" id="oportunidades" min="0" value="${oportunidadesVal}" placeholder="Ej: 4"
          style="width:100%;border:1px solid var(--border);border-radius:10px;padding:12px;font-family:'Karla';font-size:16px;margin-bottom:16px;background:#FCFCF9;box-sizing:border-box">

        <label class="note-label strong" for="compromisoVeces">¿Cuántas veces te comprometes a hacerlo esta semana? (solo el número)</label>
        <input type="number" id="compromisoVeces" min="0" value="${compromisoVal}" placeholder="Ej: 3"
          style="width:100%;border:1px solid var(--border);border-radius:10px;padding:12px;font-family:'Karla';font-size:16px;margin-bottom:4px;background:#FCFCF9;box-sizing:border-box">
        <p style="font-size:13px;color:var(--ink-soft);margin:0 0 14px">Sin forzarte: elige un número que puedas sostener.</p>

        <button class="btn btn-yes" id="btnRegistrarTodo" style="text-align:center">📲 Registrar y compartir en WhatsApp</button>
        <div class="saved-msg">${state.savedMsg || state.compromisoMsg || ''}</div>
        <button class="link-quiet" id="btnComoCuenta" style="padding:0;margin-top:10px">ℹ️ ¿Cómo cuenta la app mi cumplimiento?</button>
      `;
      app.appendChild(compCard);

      const metaTrimEl = compCard.querySelector('#metaTrim');
      const identidadEl = compCard.querySelector('#identidad');
      const metaSemEl = compCard.querySelector('#metaSem');
      const oportEl = compCard.querySelector('#oportunidades');
      const compEl = compCard.querySelector('#compromisoVeces');

      function limpiarFalta(e){ e.target.classList.remove('campo-falta'); state.compromisoMsg = ''; }
      metaTrimEl.oninput = (e) => { state.metaTrimDraft = e.target.value; limpiarFalta(e); };
      identidadEl.oninput = (e) => { state.identidadDraft = e.target.value; limpiarFalta(e); };
      metaSemEl.oninput = (e) => { state.metaSemDraft = e.target.value; limpiarFalta(e); };
      oportEl.oninput = (e) => { state.oportunidadesDraft = e.target.value; limpiarFalta(e); };
      compEl.oninput = (e) => { state.compromisoDraft = e.target.value; limpiarFalta(e); };

      compCard.querySelector('#btnComoCuenta').onclick = () => { state.prevView = 'checkin'; state.view = 'comoCuenta'; window.scrollTo(0,0); render(); };

      // Un único guardado: cierra la semana pasada, guarda el compromiso nuevo y comparte
      compCard.querySelector('#btnRegistrarTodo').onclick = () => {
        const hayCierrePendiente = !!compromisoPrev && (!yaCerrada || state.editandoCierre);

        if(hayCierrePendiente && !state.cierreEstado){
          state.compromisoMsg = '⚠️ Marca en el Paso 1 cómo te fue la semana pasada';
          render(); window.scrollTo(0,0); return;
        }
        let realizadas = 0;
        if(hayCierrePendiente && state.cierreEstado === ESTADO_PARCIAL){
          const v = vecesRealEl ? vecesRealEl.value : '';
          if(v === '' || isNaN(Number(v)) || Number(v) < 0){
            state.compromisoMsg = '⚠️ Escribe en el Paso 1 cuántas veces lo hiciste';
            render(); window.scrollTo(0,0); return;
          }
          realizadas = Number(v);
        }
        // Todos los campos del Paso 2 son obligatorios
        const obligatorios = [
          { el: metaTrimEl,   nombre: 'tu meta del trimestre' },
          { el: identidadEl,  nombre: 'tu identidad de meta' },
          { el: metaSemEl,    nombre: 'cuándo y cómo lo harás' },
          { el: oportEl,      nombre: 'las oportunidades que estimas' },
          { el: compEl,       nombre: 'a cuántas veces te comprometes' }
        ];
        compCard.querySelectorAll('.campo-falta').forEach(n => n.classList.remove('campo-falta'));
        const faltan = obligatorios.filter(c => String(c.el.value).trim() === '');
        if(faltan.length){
          faltan.forEach(c => c.el.classList.add('campo-falta'));
          state.compromisoMsg = (faltan.length === 1)
            ? '⚠️ Falta ' + faltan[0].nombre
            : '⚠️ Faltan ' + faltan.length + ' campos por rellenar';
          const msgEl = compCard.querySelector('.saved-msg');
          if(msgEl){ msgEl.textContent = state.compromisoMsg; msgEl.style.color = '#B94A3A'; }
          faltan[0].el.scrollIntoView({ behavior:'smooth', block:'center' });
          faltan[0].el.focus();
          return;
        }
        if(isNaN(Number(compEl.value))){
          state.compromisoMsg = '⚠️ El compromiso tiene que ser un número';
          const msgEl = compCard.querySelector('.saved-msg');
          if(msgEl){ msgEl.textContent = state.compromisoMsg; msgEl.style.color = '#B94A3A'; }
          compEl.classList.add('campo-falta'); compEl.focus();
          return;
        }

        const identidadTxt = identidadEl.value.trim();
        const metaSemTxt = metaSemEl.value.trim();
        const compromisoNum = Number(compEl.value);
        const notaEl2 = document.querySelector('#nota');
        const notaTxt = notaEl2 ? notaEl2.value : '';

        // Estado final del cierre (un parcial completo cuenta como cumplido)
        let estadoFinal = state.cierreEstado;
        if(estadoFinal === ESTADO_PARCIAL && realizadas >= compromisoPrev){
          estadoFinal = ESTADO_CUMPLIDO;
          realizadas = compromisoPrev;
        }

        // Mensaje de WhatsApp
        let msg = '🗓️ Mi Lunes de Compromiso (' + rangoSemanaTexto(today) + ')\n';
        const avanceTxt = avanceTrimestreTexto();
        if(avanceTxt) msg += '📊 ' + avanceTxt + '\n';
        msg += '\n';
        if(hayCierrePendiente){
          if(estadoFinal === ESTADO_CUMPLIDO) msg += '✅ Semana pasada: cumplí mi compromiso de ' + compromisoPrev + (compromisoPrev === 1 ? ' vez' : ' veces') + '.\n\n';
          else if(estadoFinal === ESTADO_SIN_OPORTUNIDADES) msg += '🍃 Semana pasada: no se dieron las oportunidades que pensaba.\n\n';
          else msg += '🔸 Semana pasada: hice ' + realizadas + ' de las ' + compromisoPrev + '.\n\n';
        }
        if(identidadTxt) msg += '🪞 ' + identidadTxt + '\n\n';
        msg += '🎯 Esta semana me comprometo a hacerlo ' + compromisoNum + (compromisoNum === 1 ? ' vez' : ' veces') + '.';
        if(metaSemTxt) msg += '\n📌 ' + metaSemTxt;

        // Guardar todo y después compartir
        const tareas = [];
        if(hayCierrePendiente){
          tareas.push(saveCierreSemana(estadoFinal, realizadas, compromisoPrev, notaTxt));
        }
        Promise.all(tareas)
          .then(() => saveCompromisoSemana(oportEl.value, compEl.value, identidadEl.value, metaTrimEl.value, metaSemEl.value))
          .then(() => {
            window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank');
            state.editandoCierre = false;
            if(hayCierrePendiente){
              if(estadoFinal === ESTADO_CUMPLIDO){
                speak('¡Felicidades! Cumpliste tu compromiso de la semana.');
                state.view = 'celebrate';
              } else if(estadoFinal === ESTADO_SIN_OPORTUNIDADES){
                speak('Esta semana no se dieron las oportunidades que esperabas. No pasa nada, tu constancia sigue intacta.');
                state.view = 'sinoportunidades';
              } else {
                speak('Analiza cuáles crees que son las causas. No te preocupes, ya lo conseguirás la siguiente vez.');
                state.view = 'reflect';
              }
              state.cierreEstado = null;
              state.cierreRealizadas = null;
            }
            window.scrollTo(0,0);
            render();
          })
          .catch(err => {
            console.error('Fallo al registrar:', err);
            state.compromisoMsg = '⚠️ Error al guardar: ' + (err && err.message ? err.message : 'desconocido');
            render();
          });
      };

      return;
    }

    if(state.view === 'comoCuenta'){
      renderBackTopbar('¿Cómo cuenta la app?');
      app.appendChild(el(`
        <div class="card">
          <p style="margin:0 0 14px;font-size:14px;color:var(--ink-soft)">
            Cada lunes cierras la semana que acaba de terminar y defines tu compromiso para la que empieza.
            Así se registra cada caso:
          </p>

          <div class="badge-scale-row"><span><b>Hiciste todas las veces</b></span><span>Suma 1 punto</span></div>
          <p style="font-size:13px;color:var(--ink-soft);margin:-2px 0 12px 2px">
            Cumpliste tu compromiso completo. Suma un punto entero para tu nivel.
          </p>

          <div class="badge-scale-row"><span><b>Lo hiciste algunas veces</b></span><span>Suma esa parte</span></div>
          <p style="font-size:13px;color:var(--ink-soft);margin:-2px 0 12px 2px">
            Suma exactamente lo que hiciste: 3 de 5 suma 0,6 puntos; 4 de 5 suma 0,8.
            Tu esfuerzo real cuenta, no se redondea a cero. En el calendario queda como «3/5».
          </p>

          <div class="badge-scale-row"><span><b>No se dieron las oportunidades</b></span><span>Suma 0,25 puntos</span></div>
          <p style="font-size:13px;color:var(--ink-soft);margin:-2px 0 12px 2px">
            No es un fallo tuyo: la vida no puso las ocasiones. No se vive como incumplimiento
            y sigue sumando una parte, porque tu intención estuvo ahí.
          </p>

          <p style="font-weight:700;margin:16px 0 6px">Cómo se calcula tu nivel</p>
          <p style="font-size:13px;color:var(--ink-soft);margin:0 0 10px">
            Se van sumando esos puntos semana a semana. Cuando el total pasa cada umbral,
            cambias de insignia: Caminante a partir de 10 puntos, Conocedor de Sombras a partir de 30,
            Maestro Integral a partir de 50, Testigo a partir de 70 y Consciencia no dual a partir de 100.
          </p>
          <p style="font-size:13px;color:var(--ink-soft);margin:0">
            Por eso el total puede tener decimales (por ejemplo 12,6 puntos): recoge también
            las semanas que cumpliste a medias. Tu calendario, en cambio, guarda las veces exactas
            de cada semana, para que veas tu recorrido completo y no solo los extremos.
          </p>
        </div>
      `));
      return;
    }

    if(state.view === 'group'){
      const nav = document.createElement('nav');
      nav.className = 'tabs';
      nav.innerHTML = `<button id="toPanel">📋 Panel</button><button id="toCheckin">Registro</button><button class="active">Mi grupo</button>`;
      app.appendChild(nav);
      nav.querySelector('#toPanel').onclick = () => { state.view='panel'; window.scrollTo(0,0); render(); };
      nav.querySelector('#toCheckin').onclick = () => { state.view='checkin'; window.scrollTo(0,0); render(); };

      app.appendChild(el(`<h1>Registro de los compañeros</h1><p class="lead">${currentWeekLabel}</p>`));

      if(state.loadError){
        app.appendChild(el(`<div class="card" style="border-color:var(--honey);color:var(--ink-soft);font-size:13px">No se pudo conectar con la base de datos. Comprueba tu conexión a internet y vuelve a intentarlo.</div>`));
      }

      const card = document.createElement('div');
      card.className = 'card';
      const visibleMembers = isModerador(state.me)
        ? state.members
        : state.members.filter(m => m === state.me || shareGroup(state.me, m));
      if(visibleMembers.length === 0){
        card.innerHTML = `<div class="empty">Aún no hay nadie en el grupo.</div>`;
      } else {
        card.innerHTML = visibleMembers.map(m => {
          const list = state.checkins[m] || [];
          const entry = list.find(c => c.week === currentWeekShort || c.week === currentWeek);
          const pill = entry
            ? (entry.cumplida ? `<span class="status-pill status-yes">Cumplida ✓</span>` : `<span class="status-pill status-no">Sin cumplir</span>`)
            : `<span class="status-pill status-no">Aún no responde</span>`;
          return `<div class="roster-row"><span class="roster-name">${m}</span>${pill}</div>`;
        }).join('');
      }
      app.appendChild(card);
      return;
    }

    if(state.view === 'manage'){
      app.appendChild(el(`<h1>Gestionar personas</h1><p class="lead">Máximo 10 personas activas en el grupo.</p>`));
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = state.members.map(m => `
        <div class="manage-row"><span style="flex:1">${m}</span><button class="icon-btn" data-name="${m}">✕</button></div>
      `).join('') + (state.members.length === 0 ? '<div class="empty">Todavía no hay nadie.</div>' : '');
      app.appendChild(card);
      card.querySelectorAll('.icon-btn').forEach(b => {
        b.onclick = () => removeMember(b.getAttribute('data-name'));
      });

      if(state.members.length < 10){
        const addRow = document.createElement('div');
        addRow.className = 'manage-row';
        addRow.innerHTML = `<input type="text" id="newName" placeholder="Nombre nuevo"><button class="icon-btn" id="addBtn">＋</button>`;
        app.appendChild(addRow);
        addRow.querySelector('#addBtn').onclick = () => {
          const inp = addRow.querySelector('#newName');
          addMember(inp.value);
          inp.value = '';
        };
        addRow.querySelector('#newName').onkeydown = (e) => {
          if(e.key === 'Enter'){ addMember(e.target.value); e.target.value=''; }
        };
      } else {
        app.appendChild(el(`<p class="cap-note">Has llegado al máximo de 10 personas.</p>`));
      }

      const back = document.createElement('button');
      back.className = 'link-quiet';
      back.textContent = '← Volver';
      back.onclick = () => { state.view = state.me ? 'checkin' : 'pick'; render(); };
      app.appendChild(back);
      return;
    }
  }

  try {
    init();
  } catch(err){
    app.innerHTML = '<div style="padding:24px;font-family:sans-serif">No se pudo iniciar la app: ' + (err && err.message ? err.message : err) + '</div>';
  }
})();
</script>
</body>
</html>
