<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metas Amables — Registro semanal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FFFFFF;
    --surface: #FFFFFF;
    --ink: #101010;
    --ink-soft: #63625A;
    --border: #E2E1D8;
    --moss: #E8002C;
    --moss-deep: #A8001F;
    --moss-tint: #FCE7EB;
    --honey: #C9942D;
    --honey-tint: #FAF0DC;
    --leaf: #E8002C;
    --radius: 14px;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Karla', sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .app{
    max-width: 480px;
    margin: 0 auto;
    padding: 28px 20px 60px;
    min-height: 100vh;
  }
  .wordmark{
    font-family: 'Lora', serif;
    font-weight: 600;
    font-size: 22px;
    color: var(--moss-deep);
    letter-spacing: -0.01em;
  }
  .wordmark span{ color: var(--ink-soft); font-weight: 400; font-size: 15px; display:block; margin-top: 2px; font-family:'Karla',sans-serif; }
  .brand-row{ display:flex; align-items:center; gap:10px; }
  .brand-icon{ width:34px; height:34px; border-radius:50%; object-fit:cover; flex-shrink:0; }
  .brand-hero{ width:100%; max-width:340px; height:auto; display:block; margin: 4px auto 22px; }
  
  header.top{
    display:flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 28px;
  }
  .who{
    text-align:right;
    font-size: 14px;
    color: var(--ink-soft);
  }
  .who .greeting{
    font-family: 'Lora', serif;
    font-size: 20px;
    font-weight: 600;
    color: var(--ink);
    display:block;
    line-height: 1.2;
  }
  .who button{
    background:none; border:none; color: var(--moss); font-family:'Karla'; font-size:13px;
    text-decoration: underline; cursor:pointer; padding: 2px 0; margin-top:2px;
  }
  h1{ font-family:'Lora',serif; font-size: 26px; font-weight:600; margin: 0 0 6px; color: var(--ink); line-height:1.25;}
  p.lead{ color: var(--ink-soft); font-size: 15px; line-height:1.5; margin: 0 0 24px; }

  /* Name picker */
  .grid-names{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 22px;
  }
  .name-card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 14px;
    font-family: 'Karla';
    font-size: 15px;
    font-weight: 500;
    color: var(--ink);
    cursor: pointer;
    text-align: left;
    transition: border-color .15s ease, background .15s ease;
  }
  .name-card:hover{ border-color: var(--moss); background: var(--moss-tint); }
  .name-card:active{ transform: translateY(1px); }

  .link-quiet{
    display:inline-block;
    color: var(--ink-soft);
    font-size: 14px;
    text-decoration: underline;
    cursor: pointer;
    background:none; border:none; font-family:'Karla'; padding: 6px 0;
  }
  .link-quiet:hover{ color: var(--moss-deep); }

  /* Card / section */
  .card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
    margin-bottom: 18px;
  }
  .week-label{
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  .question{
    font-family:'Lora', serif;
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 18px;
    line-height:1.35;
  }
  .btn{
    width:100%;
    display:block;
    padding: 14px 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    font-family:'Karla';
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 10px;
    text-align: left;
    transition: all .15s ease;
    color: var(--ink);
  }
  .btn .sub{ display:block; font-weight:400; font-size:13px; color:var(--ink-soft); margin-top:2px;}
  .btn-yes{ border-color: var(--moss); }
  .btn-yes:hover{ background: var(--moss); color: #fff; }
  .btn-yes:hover .sub{ color: #DCE9DD; }
  .btn-no{ border-color: var(--honey); }
  .btn-no:hover{ background: var(--honey); color:#fff; }
  .btn-no:hover .sub{ color: #FCEBCE; }

  .btn-yes.selected{ background: var(--moss); border-color: var(--moss); color:#fff; }
  .btn-yes.selected .sub{ color:#DCE9DD; }
  .btn-no.selected{ background: var(--honey); border-color: var(--honey); color:#fff; }
  .btn-no.selected .sub{ color:#FCEBCE; }

  textarea{
    width:100%;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    font-family:'Karla';
    font-size: 14px;
    color: var(--ink);
    resize: vertical;
    min-height: 60px;
    margin-top: 4px;
    background: #FCFCF9;
  }
  textarea:focus, .name-card:focus, .btn:focus{ outline: 2px solid var(--moss); outline-offset: 1px; }
  label.note-label{ font-size:13px; color: var(--ink-soft); display:block; margin-bottom:2px; }

  .saved-msg{
    font-size: 13px;
    color: var(--moss-deep);
    margin-top: 10px;
    min-height: 16px;
  }

  .history-row{
    display:flex;
    gap: 6px;
    margin-top: 4px;
    flex-wrap: wrap;
  }
  .dot{
    width: 26px; height: 26px;
    border-radius: 7px;
    display:flex; align-items:center; justify-content:center;
    font-size: 12px;
    border: 1px solid var(--border);
    color: var(--ink-soft);
    background: #FCFCF9;
  }
  .dot.yes{ background: var(--moss); border-color: var(--moss); color:#fff; }
  .dot.no{ background: var(--honey-tint); border-color: var(--honey); color: var(--honey); }

  nav.tabs{
    display:flex;
    gap: 8px;
    margin-bottom: 22px;
    border-bottom: 1px solid var(--border);
  }
  nav.tabs button{
    background:none; border:none; font-family:'Karla'; font-size:14px; font-weight:700;
    color: var(--ink-soft); padding: 8px 2px 10px; cursor:pointer; border-bottom: 2px solid transparent;
    margin-right: 14px;
  }
  nav.tabs button.active{ color: var(--moss-deep); border-color: var(--moss); }

  .roster-row{
    display:flex; justify-content: space-between; align-items:center;
    padding: 12px 0; border-bottom: 1px solid var(--border);
    font-size: 15px;
  }
  .roster-row:last-child{ border-bottom:none; }
  .roster-name{ font-weight: 500; }
  .status-pill{
    font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 100px;
  }
  .status-yes{ background: var(--moss-tint); color: var(--moss-deep); }
  .status-no{ background: #F1EFE6; color: var(--ink-soft); }

  .manage-row{ display:flex; gap:8px; align-items:center; padding: 8px 0; border-bottom:1px solid var(--border); }
  .manage-row input[type=text]{
    flex:1; border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-family:'Karla'; font-size:14px;
  }
  .icon-btn{
    background:none; border:1px solid var(--border); border-radius:8px; width:32px; height:32px;
    cursor:pointer; color: var(--ink-soft); font-size:16px; line-height:1;
  }
  .icon-btn:hover{ border-color:#B94A3A; color:#B94A3A; }

  .empty{
    text-align:center; padding: 30px 10px; color: var(--ink-soft); font-size: 14px;
  }
  .cap-note{ font-size:13px; color:var(--ink-soft); margin-top: 10px;}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
(function(){
  const app = document.getElementById('app');
  let state = {
    view: 'loading',
    me: null,
    members: [],
    checkins: {},
    passwords: {},
    loginError: '',
    loginView: 'login',
    selection: null,
    noteDraft: '',
    metaTrimDraft: '',
    metaSemDraft: '',
    identidadDraft: '',
    saving: false,
    savedMsg: '',
    metaSavedMsg: ''
  };

  function isoWeek(d){
    const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    const dayNum = (date.getUTCDay() + 6) % 7;
    date.setUTCDate(date.getUTCDate() - dayNum + 3);
    const firstThursday = new Date(Date.UTC(date.getUTCFullYear(),0,4));
    const weekNum = 1 + Math.round(((date - firstThursday) / 86400000 - 3 + ((firstThursday.getUTCDay()+6)%7)) / 7);
    return date.getUTCFullYear() + '-W' + String(weekNum).padStart(2,'0');
  }

  function weekLabel(d){
    const day = (d.getDay()+6)%7;
    const monday = new Date(d); monday.setDate(d.getDate() - day);
    const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
    const opts = {day:'numeric', month:'long'};
    return 'Semana del ' + monday.toLocaleDateString('es-ES',{day:'numeric'}) + ' al ' + sunday.toLocaleDateString('es-ES', opts);
  }

  function weekShort(d){
    const day = (d.getDay()+6)%7;
    const monday = new Date(d); monday.setDate(d.getDate() - day);
    const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
    const m = monday.toLocaleDateString('es-ES',{month:'short'}).replace('.','');
    return monday.getDate() + '-' + sunday.getDate() + ' ' + m + ' ' + monday.getFullYear();
  }

  const today = new Date();
  const currentWeek = isoWeek(today);
  const currentWeekLabel = weekLabel(today);
  const currentWeekShort = weekShort(today);

  // Trimestre actual
  const currentQ = Math.floor(today.getMonth() / 3) + 1;
  const qNames = {1:'1er',2:'2º',3:'3er',4:'4º'};
  const qMonths = {
    1:['enero','febrero','marzo'],
    2:['abril','mayo','junio'],
    3:['julio','agosto','septiembre'],
    4:['octubre','noviembre','diciembre']
  };
  const currentQLabel = qNames[currentQ] + ' trimestre';
  const currentQMonths = qMonths[currentQ];

  // Calcular todas las semanas (lunes) del trimestre actual
  function getQuarterWeeks(){
    const qStart = new Date(today.getFullYear(), (currentQ-1)*3, 1);
    const qEnd = new Date(today.getFullYear(), currentQ*3, 0); // último día del trimestre
    const weeks = [];
    // Buscar el primer lunes del trimestre (o el lunes anterior si el 1 no es lunes)
    const d = new Date(qStart);
    const dayOfWeek = (d.getDay()+6)%7; // 0=lunes
    d.setDate(d.getDate() - dayOfWeek); // retroceder al lunes
    while(d <= qEnd){
      weeks.push({
        iso: isoWeek(d),
        short: weekShort(d),
        month: d.toLocaleDateString('es-ES',{month:'short'}).replace('.','')
      });
      d.setDate(d.getDate() + 7);
    }
    return weeks;
  }
  const quarterWeeks = getQuarterWeeks();

  const DEFAULT_MEMBERS = ['Empar','Rafael','Rosa','Shayo','Ana María'];

  const APP_VERSION = 'V9';

  // ==== Conexión con Airtable ====
  const AIR = {
    base: 'appB3nXTGf3wWu0sI',
    table: 'tblYUORCDMOtD3FFo',
    token: 'patlb45ssWQHLu4dI.936da71c7b6f1b9c7610af4210526432faa54955e102f782583bee55a009608d',
    fields: { alumno: 'Practicante', semana: 'Semana', cumplida: 'Cumplida', notas: 'Notas', metaTrim: 'Meta trimestre', metaSem: 'Meta semana', identidad: 'Identidad', pass: 'Contraseña' }
  };
  const AIR_URL = 'https://api.airtable.com/v0/' + AIR.base + '/' + encodeURIComponent(AIR.table);
  function airHeaders(){
    return { 'Authorization': 'Bearer ' + AIR.token, 'Content-Type': 'application/json' };
  }

  // Trae TODAS las filas de la tabla y las agrupa por practicante
  async function fetchAllRecords(){
    let all = [];
    let offset = null;
    do {
      let url = AIR_URL + '?pageSize=100';
      if(offset) url += '&offset=' + encodeURIComponent(offset);
      const res = await fetch(url, { headers: airHeaders() });
      if(!res.ok){ throw new Error('Airtable ' + res.status); }
      const data = await res.json();
      all = all.concat(data.records || []);
      offset = data.offset;
    } while(offset);
    return all;
  }

  function recordsToCheckins(records){
    const byName = {};
    const passwords = {};
    records.forEach(r => {
      const f = r.fields || {};
      const name = f[AIR.fields.alumno];
      if(!name) return;
      if(!byName[name]) byName[name] = [];
      if(f[AIR.fields.pass]) passwords[name] = f[AIR.fields.pass];
      byName[name].push({
        id: r.id,
        week: f[AIR.fields.semana] || '',
        label: f[AIR.fields.semana] || '',
        cumplida: !!f[AIR.fields.cumplida],
        nota: f[AIR.fields.notas] || '',
        metaTrim: f[AIR.fields.metaTrim] || '',
        metaSem: f[AIR.fields.metaSem] || '',
        identidad: f[AIR.fields.identidad] || ''
      });
    });
    return { byName, passwords };
  }

  async function refreshAll(){
    const records = await fetchAllRecords();
    const result = recordsToCheckins(records);
    state.checkins = result.byName;
    state.passwords = result.passwords;
    state.members = Object.keys(result.passwords);
    state.members.forEach(m => { if(!state.checkins[m]) state.checkins[m] = []; });
    state.loadError = null;
  }

  async function init(){
    state.view = 'pick';
    render();
    try {
      await refreshAll();
    } catch(e){
      state.loadError = e.message;
    }
    render();
  }

  function loginWithPassword(pass){
    pass = (pass || '').trim();
    if(!pass){ state.loginError = 'Escribe tu contraseña'; render(); return; }
    const found = Object.entries(state.passwords).find(([name, p]) => p === pass);
    if(!found){ state.loginError = 'Contraseña incorrecta'; render(); return; }
    state.loginError = '';
    pickMe(found[0]);
  }

  async function changePassword(currentPass, newPass){
    currentPass = (currentPass||'').trim();
    newPass = (newPass||'').trim();
    if(!currentPass || !newPass){ state.loginError = 'Rellena ambos campos'; render(); return; }
    if(newPass.length < 3){ state.loginError = 'La nueva contraseña debe tener al menos 3 caracteres'; render(); return; }
    const found = Object.entries(state.passwords).find(([name, p]) => p === currentPass);
    if(!found){ state.loginError = 'Contraseña actual incorrecta'; render(); return; }
    const userName = found[0];
    const records = state.checkins[userName] || [];
    try {
      for(const rec of records){
        if(rec.id){
          const fields = {}; fields[AIR.fields.pass] = newPass;
          await fetch(AIR_URL + '/' + rec.id, { method:'PATCH', headers:airHeaders(), body:JSON.stringify({fields}) });
        }
      }
      state.passwords[userName] = newPass;
      state.loginError = '';
      state.loginView = 'login';
      state.savedMsg = 'Contraseña cambiada ✓';
      render();
    } catch(e){
      state.loginError = 'No se pudo cambiar (revisa tu conexión)';
      render();
    }
  }

  async function ensureCheckins(name){
    if(!state.checkins[name]) state.checkins[name] = [];
    return state.checkins[name];
  }

  // Estas ya no se usan con Airtable pero se mantienen como no-op para compatibilidad
  async function saveMembers(){ /* miembros fijos en esta versión */ }

  async function pickMe(name){
    state.me = name;
    state.selection = null;
    state.noteDraft = '';
    state.metaTrimDraft = '';
    state.metaSemDraft = '';
    state.identidadDraft = '';
    state.savedMsg = '';
    state.metaSavedMsg = '';
    state.view = 'checkin';
    render();
    try { await refreshAll(); } catch(e){}
    const list = state.checkins[name] || [];
    // Identidad y meta trimestral: del registro más reciente (cualquier semana)
    if(list.length > 0){
      const latest = list[list.length - 1];
      state.identidadDraft = latest.identidad || '';
      state.metaTrimDraft = latest.metaTrim || '';
    }
    // Meta semanal: solo si ya hay registro de ESTA semana
    const thisWeek = list.find(c => c.week === currentWeekShort);
    if(thisWeek){
      state.metaSemDraft = thisWeek.metaSem || '';
      state.selection = thisWeek.cumplida ? 'yes' : (thisWeek.week === currentWeekShort ? null : 'no');
      state.noteDraft = thisWeek.nota || '';
    }
    render();
  }

  async function saveMetas(identidad, metaTrim, metaSem){
    state.identidadDraft = identidad || '';
    state.metaTrimDraft = metaTrim || '';
    state.metaSemDraft = metaSem || '';
    state.metaSavedMsg = 'Guardando…';
    render();

    const list = await ensureCheckins(state.me);
    // Solo actualiza si ya hay una fila para ESTA semana exacta
    const thisWeek = list.find(c => c.week === currentWeekShort);
    const fields = {};
    fields[AIR.fields.alumno] = state.me;
    fields[AIR.fields.semana] = currentWeekShort;
    fields[AIR.fields.identidad] = (identidad || '').trim();
    fields[AIR.fields.metaTrim] = (metaTrim || '').trim();
    fields[AIR.fields.metaSem] = (metaSem || '').trim();
    fields[AIR.fields.pass] = state.passwords[state.me] || '';

    try {
      if(thisWeek && thisWeek.id){
        // Actualizar fila de esta semana
        const res = await fetch(AIR_URL + '/' + thisWeek.id, {
          method: 'PATCH', headers: airHeaders(), body: JSON.stringify({ fields })
        });
        if(!res.ok) throw new Error('Airtable ' + res.status);
        thisWeek.identidad = fields[AIR.fields.identidad];
        thisWeek.metaTrim = fields[AIR.fields.metaTrim];
        thisWeek.metaSem = fields[AIR.fields.metaSem];
      } else {
        // Crear fila nueva para esta semana
        const res = await fetch(AIR_URL, {
          method: 'POST', headers: airHeaders(), body: JSON.stringify({ fields })
        });
        if(!res.ok) throw new Error('Airtable ' + res.status);
        const data = await res.json();
        list.push({ id: data.id, week: currentWeekShort, label: currentWeekLabel, cumplida: false, nota:'', identidad: fields[AIR.fields.identidad], metaTrim: fields[AIR.fields.metaTrim], metaSem: fields[AIR.fields.metaSem] });
      }
      state.metaSavedMsg = 'Guardado ✓';
    } catch(e){
      state.metaSavedMsg = 'No se pudo guardar (revisa tu conexión)';
    }
    render();
  }

  async function saveCheckin(val, nota, metaTrim, metaSem, identidad){
    state.selection = val;
    state.noteDraft = nota;
    state.metaTrimDraft = metaTrim || '';
    state.metaSemDraft = metaSem || '';
    state.identidadDraft = identidad || '';
    state.saving = true;
    state.savedMsg = 'Guardando…';
    render();

    const list = await ensureCheckins(state.me);
    // Solo actualiza si ya hay fila para ESTA semana exacta
    const thisWeek = list.find(c => c.week === currentWeekShort);
    const fields = {};
    fields[AIR.fields.alumno] = state.me;
    fields[AIR.fields.semana] = currentWeekShort;
    fields[AIR.fields.cumplida] = (val === 'yes');
    fields[AIR.fields.notas] = (nota || '').trim();
    fields[AIR.fields.metaTrim] = (metaTrim || '').trim();
    fields[AIR.fields.metaSem] = (metaSem || '').trim();
    fields[AIR.fields.identidad] = (identidad || '').trim();
    fields[AIR.fields.pass] = state.passwords[state.me] || '';

    try {
      if(thisWeek && thisWeek.id){
        // Actualizar fila de esta semana
        const res = await fetch(AIR_URL + '/' + thisWeek.id, {
          method: 'PATCH', headers: airHeaders(), body: JSON.stringify({ fields })
        });
        if(!res.ok) throw new Error('Airtable ' + res.status);
        thisWeek.cumplida = (val==='yes');
        thisWeek.nota = fields[AIR.fields.notas];
        thisWeek.identidad = fields[AIR.fields.identidad];
        thisWeek.metaTrim = fields[AIR.fields.metaTrim];
        thisWeek.metaSem = fields[AIR.fields.metaSem];
      } else {
        // Crear fila nueva para esta semana
        const res = await fetch(AIR_URL, {
          method: 'POST', headers: airHeaders(), body: JSON.stringify({ fields })
        });
        if(!res.ok) throw new Error('Airtable ' + res.status);
        const data = await res.json();
        list.push({ id: data.id, week: currentWeekShort, label: currentWeekLabel, cumplida: (val==='yes'), nota: fields[AIR.fields.notas], identidad: fields[AIR.fields.identidad], metaTrim: fields[AIR.fields.metaTrim], metaSem: fields[AIR.fields.metaSem] });
      }
      state.saving = false;
      state.savedMsg = 'Guardado ✓';
    } catch(e){
      state.saving = false;
      state.savedMsg = 'No se pudo guardar (revisa tu conexión)';
    }
    render();
  }

  async function openGroupPanel(){
    state.view = 'group';
    render();
    try { await refreshAll(); } catch(e){ /* mantener lo que haya */ }
    render();
  }

  async function openManage(){
    state.view = 'manage';
    render();
  }

  async function addMember(name){
    name = name.trim();
    if(!name) return;
    if(state.members.length >= 10) return;
    if(state.members.includes(name)) return;
    state.members.push(name);
    await saveMembers(state.members);
    render();
  }

  async function removeMember(name){
    state.members = state.members.filter(m => m !== name);
    await saveMembers(state.members);
    if(state.me === name){ state.me = null; state.view = 'pick'; }
    render();
  }

  function switchUser(){
    state.me = null;
    state.view = 'pick';
    render();
  }

  function lastWeeksHistory(name, n){
    const list = state.checkins[name] || [];
    const map = {};
    list.forEach(c => map[c.week] = c);
    const out = [];
    for(let i=n-1; i>=0; i--){
      const d = new Date(today);
      d.setDate(d.getDate() - i*7);
      const w = isoWeek(d);
      out.push(map[w] || null);
    }
    return out;
  }

  function el(html){
    const t = document.createElement('template');
    t.innerHTML = html.trim();
    return t.content;
  }

  function render(){
    app.innerHTML = '';

    if(state.view === 'loading'){
      app.appendChild(el(`<div class="empty">Cargando…</div>`));
      return;
    }

    // header

        formCard.className = 'card';
        formCard.innerHTML = `
          <label class="note-label">Contraseña actual</label>
          <input type="password" id="currentPass" placeholder="Tu contraseña actual" style="width:100%;border:1px solid var(--border);border-radius:10px;padding:12px;font-family:'Karla';font-size:15px;margin-bottom:12px;background:#FCFCF9;box-sizing:border-box">

      const latest = list.length > 0 ? list[list.length - 1] : null;
      const sel = state.selection !== null ? state.selection : (thisWeek ? (thisWeek.cumplida ? 'yes' : 'no') : null);

      // Tarjeta de identidad + metas
      const metaCard = document.createElement('div');
      metaCard.className = 'card';
      const curIdentidad = state.identidadDraft || (latest ? latest.identidad : '') || '';
      const curMetaTrim = state.metaTrimDraft || (latest ? latest.metaTrim : '') || '';
      const curMetaSem = state.metaSemDraft || (thisWeek ? thisWeek.metaSem : '') || '';
      metaCard.innerHTML = `
        <div class="question" style="font-size:17px;margin-bottom:14px">🪞 Mi identidad de meta</div>
        <textarea id="identidad" placeholder="Ej: María, la que hace yoga cuatro veces por semana" style="min-height:44px;margin-bottom:18px">${curIdentidad}</textarea>
        <div class="question" style="font-size:17px;margin-bottom:12px">🎯 Tus metas</div>
        <label class="note-label" for="metaTrim">Meta ${currentQLabel} (${currentQMonths.join(', ')})</label>
        <textarea id="metaTrim" placeholder="¿Cuál es tu meta para este trimestre?" style="min-height:44px;margin-bottom:12px">${curMetaTrim}</textarea>
        <label class="note-label" for="metaSem">Meta semanal (${currentWeekLabel.replace('Semana d','d')})</label>
        <textarea id="metaSem" placeholder="¿Qué te propones esta semana?" style="min-height:44px;margin-bottom:14px">${curMetaSem}</textarea>
        <button class="btn btn-yes" id="btnSaveMetas" style="text-align:center">Guardar</button>
        <div class="saved-msg">${state.metaSavedMsg}</div>
      `;
      app.appendChild(metaCard);
      const identidadEl = metaCard.querySelector('#identidad');
      const metaTrimEl = metaCard.querySelector('#metaTrim');
      const metaSemEl = metaCard.querySelector('#metaSem');
      identidadEl.oninput = (e) => { state.identidadDraft = e.target.value; state.metaSavedMsg=''; };
      metaTrimEl.oninput = (e) => { state.metaTrimDraft = e.target.value; state.metaSavedMsg=''; };
      metaSemEl.oninput = (e) => { state.metaSemDraft = e.target.value; state.metaSavedMsg=''; };
      metaCard.querySelector('#btnSaveMetas').onclick = () => saveMetas(identidadEl.value, metaTrimEl.value, metaSemEl.value);

      // Tarjeta de checkin semanal
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="week-label">${currentWeekLabel}</div>
        <div class="question">¿Cumpliste tu práctica esta semana?</div>
        <button class="btn btn-yes ${sel==='yes'?'selected':''}" id="btnYes">
          Sí, la cumplí
          <span class="sub">Aunque haya sido de forma imperfecta, cuenta igual</span>
        </button>
        <button class="btn btn-no ${sel==='no'?'selected':''}" id="btnNo">
          Esta vez no
          <span class="sub">No pasa nada, la semana que viene la retomas</span>
        </button>
        <label class="note-label" for="nota">Nota (solo la ves tú y Gustavo)</label>
        <textarea id="nota" placeholder="¿Algo que quieras contar sobre esta semana?">${thisWeek ? thisWeek.nota : state.noteDraft}</textarea>
        <div class="saved-msg">${state.savedMsg}</div>
      `;
      app.appendChild(card);
      const notaEl = card.querySelector('#nota');
      notaEl.oninput = (e) => { state.noteDraft = e.target.value; state.savedMsg=''; };
      card.querySelector('#btnYes').onclick = () => saveCheckin('yes', notaEl.value, metaTrimEl.value, metaSemEl.value, identidadEl.value);
      card.querySelector('#btnNo').onclick = () => saveCheckin('no', notaEl.value, metaTrimEl.value, metaSemEl.value, identidadEl.value);

      // Historial del trimestre actual (tabla clara con filas por mes)
      const hist = document.createElement('div');
      hist.className = 'card';
      const checkinMap = {};
      list.forEach(c => { checkinMap[c.week] = c; });

      // Agrupar semanas por mes
      const byMonth = {};
      currentQMonths.forEach(m => { byMonth[m] = []; });
      quarterWeeks.forEach(qw => { byMonth[qw.month].push(qw); });

      let histHTML = `<div class="week-label">Tu ${currentQLabel}</div>`;
      histHTML += `<div style="margin-top:10px">`;
      currentQMonths.forEach(monthName => {
        const mWeeks = byMonth[monthName] || [];
        histHTML += `<div style="margin-bottom:14px">`;
        histHTML += `<div style="font-size:13px;font-weight:600;color:var(--ink);margin-bottom:6px;text-transform:capitalize">${monthName}</div>`;
        histHTML += `<div style="display:flex;gap:6px;flex-wrap:wrap">`;
        mWeeks.forEach((qw, i) => {
          const c = checkinMap[qw.short] || checkinMap[qw.iso] || null;
          const cls = c ? (c.cumplida ? 'yes' : 'no') : '';
          const txt = c ? (c.cumplida ? '✓' : '·') : '—';
          histHTML += `<div style="display:flex;flex-direction:column;align-items:center;gap:3px">`;
          histHTML += `<div style="font-size:10px;color:var(--ink-soft)">S${i+1}</div>`;
          histHTML += `<div class="dot ${cls}" title="${qw.short}">${txt}</div>`;
          histHTML += `</div>`;
        });
        histHTML += `</div></div>`;
      });
      histHTML += `</div>`;
      hist.innerHTML = histHTML;
      app.appendChild(hist);
      return;
    }

    if(state.view === 'group'){
      const nav = document.createElement('nav');
      nav.className = 'tabs';
      nav.innerHTML = `<button id="toCheckin">Mi semana</button><button class="active">Panel del grupo</button>`;
      app.appendChild(nav);
      nav.querySelector('#toCheckin').onclick = () => { state.view='checkin'; render(); };

      app.appendChild(el(`<h1>Panel del grupo</h1><p class="lead">${currentWeekLabel}</p>`));

      if(state.loadError){
        app.appendChild(el(`<div class="card" style="border-color:var(--honey);color:var(--ink-soft);font-size:13px">No se pudo conectar con la base de datos. Comprueba tu conexión a internet y vuelve a intentarlo.</div>`));
      }

      const card = document.createElement('div');
      card.className = 'card';
      if(state.members.length === 0){
        card.innerHTML = `<div class="empty">Aún no hay nadie en el grupo.</div>`;
      } else {
        card.innerHTML = state.members.map(m => {
          const list = state.checkins[m] || [];
          const entry = list.find(c => c.week === currentWeekShort || c.week === currentWeek);
          const pill = entry
            ? (entry.cumplida ? `<span class="status-pill status-yes">Cumplida ✓</span>` : `<span class="status-pill status-no">Sin cumplir</span>`)
            : `<span class="status-pill status-no">Aún no responde</span>`;
          return `<div class="roster-row"><span class="roster-name">${m}</span>${pill}</div>`;
        }).join('');
      }
      app.appendChild(card);
      return;
    }

    if(state.view === 'manage'){
      app.appendChild(el(`<h1>Gestionar personas</h1><p class="lead">Máximo 10 personas activas en el grupo.</p>`));
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = state.members.map(m => `
        <div class="manage-row"><span style="flex:1">${m}</span><button class="icon-btn" data-name="${m}">✕</button></div>
      `).join('') + (state.members.length === 0 ? '<div class="empty">Todavía no hay nadie.</div>' : '');
      app.appendChild(card);
      card.querySelectorAll('.icon-btn').forEach(b => {
        b.onclick = () => removeMember(b.getAttribute('data-name'));
      });

      if(state.members.length < 10){
        const addRow = document.createElement('div');
        addRow.className = 'manage-row';
        addRow.innerHTML = `<input type="text" id="newName" placeholder="Nombre nuevo"><button class="icon-btn" id="addBtn">＋</button>`;
        app.appendChild(addRow);
        addRow.querySelector('#addBtn').onclick = () => {
          const inp = addRow.querySelector('#newName');
          addMember(inp.value);
          inp.value = '';
        };
        addRow.querySelector('#newName').onkeydown = (e) => {
          if(e.key === 'Enter'){ addMember(e.target.value); e.target.value=''; }
        };
      } else {
        app.appendChild(el(`<p class="cap-note">Has llegado al máximo de 10 personas.</p>`));
      }

      const back = document.createElement('button');
      back.className = 'link-quiet';
      back.textContent = '← Volver';
      back.onclick = () => { state.view = state.me ? 'checkin' : 'pick'; render(); };
      app.appendChild(back);
      return;
    }
  }

  try {
    init();
  } catch(err){
    app.innerHTML = '<div style="padding:24px;font-family:sans-serif">No se pudo iniciar la app: ' + (err && err.message ? err.message : err) + '</div>';
  }
})();
</script>
</body>
</html>
